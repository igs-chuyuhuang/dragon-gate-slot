<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>射龍門 Slot</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-overlay" style="position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <div style="color:#ffd700;font-size:1.5rem;font-weight:bold;margin-bottom:16px;">LOADING...</div>
    <div style="width:200px;height:6px;background:#333;border-radius:3px;overflow:hidden;"><div id="loading-bar" style="width:0%;height:100%;background:linear-gradient(90deg,#ffd700,#ff8c00);transition:width 0.2s;"></div></div>
  </div>
  <div class="game-root">
    <img class="bg-layer" src="assets/img/BG.png" alt="">
    <img class="bg-bonus" id="bg-bonus" src="assets/img/BG-bonus.png" style="display:none" alt="">

    <!-- Competition Timer -->
    <div id="comp-timer" style="display:none;position:absolute;top:1%;left:50%;transform:translateX(-50%);z-index:100;background:rgba(0,0,0,0.7);color:#ffd700;padding:4px 16px;border-radius:16px;font-size:0.9rem;font-weight:bold;"></div>

    <!-- Name Input Overlay -->
    <div id="name-overlay" style="display:none;position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;">
      <div style="background:#16213e;border:2px solid #ffd700;border-radius:12px;padding:24px;text-align:center;width:80%;max-width:320px;">
        <div style="color:#ffd700;font-size:1.2rem;font-weight:bold;margin-bottom:12px;">輸入你的名字</div>
        <input id="player-name-input" type="text" maxlength="12" placeholder="名字" style="width:100%;padding:10px;border-radius:6px;border:1px solid #ffd700;background:#1a1a2e;color:#fff;font-size:1rem;text-align:center;margin-bottom:12px;">
        <button id="name-confirm-btn" class="bg-deal-btn" style="width:100%;padding:10px;">開始競賽（15分鐘）</button>
      </div>
    </div>

    <!-- Jackpot Pool -->
    <div class="jp-pool-container">
      <img class="jp-pool" src="assets/img/JP-pool.png" alt="Jackpot Pool">
      <div class="jp-values">
        <span class="jp-val" id="jp-grand-val">3,000</span>
        <span class="jp-val" id="jp-major-val">500</span>
        <span class="jp-val" id="jp-mini-val">100</span>
      </div>
    </div>

    <!-- 3 Reel containers (absolute positioned on BG grid) -->
    <div class="reel" id="reel-0"><div class="reel-strip"></div></div>
    <div class="reel" id="reel-1"><div class="reel-strip"></div></div>
    <div class="reel" id="reel-2"><div class="reel-strip"></div></div>

    <!-- Badges -->
    <div class="badge badge-0" id="badge-0"></div>
    <div class="badge badge-1" id="badge-1"></div>
    <div class="badge badge-2" id="badge-2"></div>

    <!-- FG Bonus Reel -->
    <div class="fg-reel" id="fg-reel" style="display:none">
      <div class="fg-reel-strip" id="fg-reel-strip"></div>
    </div>

    <img class="mascot-dragon" src="assets/img/MS-01_mascot_dragon.png" alt="mascot">

    <!-- Bottom Control Panel -->
    <div class="ctrl-panel">
      <div class="ctrl-info-cell" id="cell-balance">
        <span class="ctrl-label">BALANCE</span>
        <span class="ctrl-val" id="balance">1,000</span>
      </div>
      <button class="ctrl-auto-upper" id="auto-btn">AUTO</button>
      <button class="spin-btn" id="spin-btn">SPIN</button>
      <div class="ctrl-bet-group">
        <span class="ctrl-label">BET</span>
        <span class="ctrl-val" id="bet">10</span>
      </div>
      <button class="ctrl-adj" id="bet-dec">−</button>
      <button class="ctrl-adj" id="bet-inc">+</button>
      <div class="ctrl-info-cell" id="cell-win">
        <span class="ctrl-label">WIN</span>
        <span class="ctrl-val" id="win">0</span>
      </div>
      <div class="ctrl-action-row">
        <button class="ctrl-func" id="vol-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.08"/></svg>
        </button>
        <button class="ctrl-func" id="turbo-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </button>
        <button class="ctrl-func" id="rules-btn">i</button>
      </div>
    </div>

    <!-- BG Control Panel (hidden by default) -->
    <div class="ctrl-panel" id="bg-ctrl-panel" style="display:none">
      <div class="ctrl-info-cell" style="position:absolute;left:7.7%;top:87.9%;">
        <span class="ctrl-label">BALANCE</span>
        <span class="ctrl-val" id="bg-balance">0</span>
      </div>
      <div class="ctrl-info-cell" style="position:absolute;left:26.7%;top:87.9%;">
        <span class="ctrl-label">TIME</span>
        <span class="ctrl-val" id="bg-round-timer">15</span>
      </div>
      <button class="spin-btn" id="bg-deal-btn" disabled>DEAL</button>
      <div class="ctrl-bet-group">
        <span class="ctrl-label">ROUND</span>
        <span class="ctrl-val" id="bg-round-counter">0/12</span>
      </div>
      <div class="ctrl-info-cell" style="position:absolute;left:80.8%;top:87.9%;">
        <span class="ctrl-label">WIN</span>
        <span class="ctrl-val" id="bg-win">0</span>
      </div>
      <div class="ctrl-action-row">
        <button class="ctrl-func" id="bg-vol-btn" style="left:9.7%;width:11.8%;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.08"/></svg>
        </button>
        <button class="ctrl-func" id="bg-turbo-btn" style="left:24%;width:11.8%;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </button>
        <button class="ctrl-func" id="bg-rules-btn" style="left:79.5%;width:8.7%;">i</button>
      </div>
    </div>

    <!-- FG info -->
    <div class="fg-info" id="fg-info" style="display:none"></div>
    <div class="results-bar" id="results"></div>

    <!-- FG Result Overlay -->
    <div class="fg-result-overlay" id="fg-result-overlay" style="display:none">
      <div class="fg-result-panel">
        <div class="fg-result-title">FREE GAME</div>
        <div class="fg-result-big" id="fg-result-big" style="display:none">BIG WIN!</div>
        <div class="fg-result-label">總贏分</div>
        <div class="fg-result-amount" id="fg-result-amount">0</div>
      </div>
    </div>

    <!-- Bonus Game (inline on game-root, not overlay) -->
    <div class="bg-inline" id="bg-inline" style="display:none">
      <div class="bg-cards">
        <div class="bg-card face" id="bg-card-l">?</div>
        <div class="bg-card back" id="bg-card-m">🐉</div>
        <div class="bg-card face" id="bg-card-r">?</div>
      </div>
      <div class="bg-gate-info" id="bg-gate-info"></div>
      <div class="bg-result-text" id="bg-result-text"></div>
    </div>
    <!-- BG chip buttons (replaces bet area) -->
    <div class="bg-chip-bar" id="bg-chip-bar" style="display:none">
      <div class="bg-chip-btns" id="bg-chip-btns"></div>
    </div>

    <!-- FG/BG Choice Overlay -->
    <div class="fg-result-overlay" id="fgbg-choice" style="display:none">
      <div class="fg-result-panel" style="position:relative;">
        <button class="rules-close" id="fgbg-close" style="position:absolute;top:-30px;right:-10px;">✕</button>
        <div class="fg-result-title">選擇獎勵模式</div>
        <div style="display:flex;flex-direction:column;gap:1rem;margin-top:1.5rem;width:100%;padding:0 1rem;pointer-events:auto;position:relative;z-index:9999;">
          <button class="bg-deal-btn" id="choose-fg" style="background:linear-gradient(135deg,#1a8c5c,#2ecc71);padding:1rem;pointer-events:auto;">FREE GAME</button>
          <button class="bg-deal-btn" id="choose-bg" style="padding:1rem;pointer-events:auto;">BONUS GAME</button>
        </div>
      </div>
    </div>

    <!-- FG/BG Info Overlay -->
    <div class="rules-overlay" id="choice-info-overlay" style="display:none;z-index:2100">
      <div class="rules-panel" style="width:80%;max-height:60vh;">
        <button class="rules-close" id="choice-info-close">✕</button>
        <div class="rules-content" id="choice-info-content"></div>
      </div>
    </div>

    <!-- Tutorial Overlay -->
    <div class="rules-overlay" id="tutorial-overlay" style="display:none;z-index:2200">
      <div class="rules-panel" style="width:80%;max-height:65vh;position:relative;">
        <button class="rules-close" id="tutorial-close" style="position:absolute;top:-30px;right:-10px;">✕</button>
        <div class="rules-content" id="tutorial-content"></div>
        <button class="bg-deal-btn" id="tutorial-start" style="margin-top:12px;width:100%;padding:0.8rem;">開始遊戲</button>
      </div>
    </div>

    <!-- Scatter Progress Ring -->
    <div class="scatter-ring" id="scatter-ring">
      <div class="ring-bg"></div>
      <svg class="ring-svg" viewBox="0 0 100 100">
        <defs>
          <filter id="glow-filter" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
            <feFlood flood-color="#00ffc8" flood-opacity="0.7" result="color"/>
            <feComposite in="color" in2="blur" operator="in" result="glow"/>
            <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g id="ring-segments"></g>
        <g id="ring-glow" filter="url(#glow-filter)"></g>
      </svg>
      <div class="ring-orb" id="ring-orb"></div>
      <img class="ring-icon" src="assets/img/SC-01_scatter_dragon.png" alt="scatter">
      <span class="ring-label" id="ring-label">0/10</span>
    </div>

    <!-- JP hidden -->
    <span id="jp-basic" style="display:none">500</span>
    <span id="jp-major" style="display:none">2000</span>
    <span id="jp-grand" style="display:none">10000</span>
  </div>

  <!-- Rules Panel -->
  <div class="rules-overlay" id="rules-overlay" style="display:none">
    <div style="width:90%;max-width:600px;height:80vh;position:relative;display:flex;flex-direction:column;align-items:center;">
      <button class="rules-close" id="rules-close" style="position:absolute;top:-36px;right:0;z-index:1;">✕</button>
      <iframe src="rules.html" style="width:100%;flex:1;border:none;border-radius:8px;"></iframe>
      <button id="rules-start-btn" class="bg-deal-btn" style="margin-top:12px;padding:10px 40px;font-size:1.1rem;display:none;">開始遊戲</button>
    </div>
  </div>

  <!-- Auto Panel -->
  <div class="auto-overlay" id="auto-overlay" style="display:none">
    <div class="auto-panel">
      <div class="auto-stepper">
        <button class="ctrl-adj" id="auto-dec">−</button>
        <span id="auto-count-display">50 局</span>
        <button class="ctrl-adj" id="auto-inc">+</button>
      </div>
      <div class="auto-actions">
        <button class="auto-start" id="auto-start">開始</button>
        <button class="auto-cancel" id="auto-cancel">取消</button>
      </div>
    </div>
  </div>

  <script>
  (function(){
    const PRELOAD_IMGS = ['BG.png','BG-bonus.png','SC-01_scatter_dragon.png','JP-pool.png',
      'FR-01_slot_frame_mobile.png','MS-01_mascot_dragon.png','golden-dragon.png',
      'GRAND.png','MAJOR.png','MINI.png','back.png',
      'CD-01_ace.png','CD-02_king.png','CD-03_queen.png','CD-04_jack.png',
      'CD-05_num2.png','CD-06_num3.png','CD-07_num4.png','CD-08_num5.png',
      'CD-09_num6.png','CD-10_num7.png','CD-11_num8.png','CD-12_num9.png','CD-13_num10.png'];
    const SFX_NAMES = ['gate_through','dragon_growl','dragon_roar','coin_fly','countup','lose','chip_select','card_deal','narrow_gate','bigwin','megawin','supermegawin','gate_rise','gate_open_sfx'];
    var loaded = 0, total = PRELOAD_IMGS.length;
    var bar = document.getElementById('loading-bar');
    function check() { loaded++; bar.style.width = (loaded/total*100)+'%'; if(loaded>=total) { document.getElementById('loading-overlay').style.display='none'; document.getElementById('rules-overlay').style.display='flex'; document.getElementById('rules-start-btn').style.display='block'; } }
    PRELOAD_IMGS.forEach(function(src){ var img=new Image(); img.onload=img.onerror=check; img.src='assets/img/'+src; });
    // SFX preload cache
    window.SFX_CACHE = {};
    SFX_NAMES.forEach(function(n){ window.SFX_CACHE[n] = new Audio('assets/sfx/'+n+'.mp3'); });
  })();
  </script>
  <script type="module">
    import { spin, countScatters } from './js/slotEngine.js';
    import { GameManager } from './js/gameManager.js';
    import { BonusGame } from './js/bonusGame.js';
    import { judgeBoard } from './js/dragonGateJudge.js';
    import { playSfx } from './js/effects/sfxBus.js';
    import { playWinLines } from './js/effects/winLine.js';
    import { playWallHit } from './js/effects/wallHit.js';
    import { revealScatters } from './js/effects/scatterReveal.js';

    let muted = false;
    let turbo = false;
    function sfx(name) { if (!muted) playSfx(name); }

    // === BGM ===
    const bgm = new Audio('assets/audio/bgm.mp3');
    bgm.loop = true;
    bgm.volume = 0.173;
    function startBGM() { bgm.play().catch(() => {}); }
    document.addEventListener('click', startBGM, { once: true });
    document.addEventListener('keydown', startBGM, { once: true });

    const gm = new GameManager();
    const $ = id => document.getElementById(id);
    let spinning = false;

    // Build scatter ring segments (10 arcs with gaps)
    (function initRing() {
      const g = $('ring-segments');
      const R = 47, SEG = 10, GAP = 4;
      const arcLen = (360 - GAP * SEG) / SEG;
      for (let i = 0; i < SEG; i++) {
        const startAngle = i * (arcLen + GAP);
        const endAngle = startAngle + arcLen;
        const s = startAngle * Math.PI / 180, e = endAngle * Math.PI / 180;
        const x1 = 50 + R * Math.cos(s), y1 = 50 + R * Math.sin(s);
        const x2 = 50 + R * Math.cos(e), y2 = 50 + R * Math.sin(e);
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${x1} ${y1} A ${R} ${R} 0 0 1 ${x2} ${y2}`);
        path.setAttribute('class', 'ring-segment');
        path.dataset.idx = i;
        g.appendChild(path);
      }
    })();

    function updateRing(count) {
      const segs = document.querySelectorAll('.ring-segment');
      const glowG = $('ring-glow');
      glowG.innerHTML = '';
      segs.forEach((s, i) => {
        const active = i < count;
        s.classList.toggle('active', active);
        s.removeAttribute('filter');
        if (active) {
          const clone = s.cloneNode(true);
          clone.setAttribute('stroke', '#ffd700');
          clone.setAttribute('stroke-width', '9');
          glowG.appendChild(clone);
        }
      });
      $('ring-label').textContent = `${count}/10`;
      // Position orb at end of progress
      const orb = $('ring-orb');
      if (count === 0) { orb.style.display = 'none'; return; }
      orb.style.display = 'block';
      const SEG = 10, GAP = 4, arcLen = (360 - GAP * SEG) / SEG;
      const angle = (count * (arcLen + GAP) - GAP / 2) - 90;
      const rad = angle * Math.PI / 180;
      const R = 47;
      orb.style.left = `${50 + R * Math.cos(rad) - 6}%`;
      orb.style.top = `${50 + R * Math.sin(rad) - 6}%`;
    }
    let autoSpins = 0, autoStopped = false, autoCount = 50;

    const CARD_IMG = {
      1:'CD-01_ace.png',2:'CD-05_num2.png',3:'CD-06_num3.png',
      4:'CD-07_num4.png',5:'CD-08_num5.png',6:'CD-09_num6.png',
      7:'CD-10_num7.png',8:'CD-11_num8.png',9:'CD-12_num9.png',
      10:'CD-13_num10.png',11:'CD-04_jack.png',12:'CD-03_queen.png',13:'CD-02_king.png'
    };
    const SC_IMG = 'SC-01_scatter_dragon.png';
    const ALL_IMGS = Object.values(CARD_IMG);
    const REEL_SYMBOLS = 30;

    function cellImg(cell) { return cell.isScatter ? SC_IMG : CARD_IMG[cell.value]; }
    function randomImg() { return ALL_IMGS[Math.floor(Math.random() * 13)]; }
    function fmt(n) { return Math.round(n).toLocaleString(); }

    // Get cell height from reel
    function getCellH() {
      const reel = document.querySelector('.reel');
      return Math.floor(reel.getBoundingClientRect().height / 3);
    }

    function buildStrip(col, finalCells) { buildStripN(col, finalCells, REEL_SYMBOLS); }

    function animateSpin(board, fgBonusSymbols, onSidesStop) {
      return new Promise(resolve => {
        spinning = true;
        const cellH = getCellH();
        if (turbo) {
          for (let col = 0; col < 3; col++) {
            const strip = document.querySelector(`#reel-${col} .reel-strip`);
            strip.innerHTML = '';
            strip.style.transition = 'none';
            strip.style.transform = 'translateY(0px)';
            for (let r = 0; r < 3; r++) {
              const div = document.createElement('div');
              div.className = 'cell';
              div.style.height = cellH + 'px';
              div.id = `cell-${r}-${col}`;
              div.innerHTML = `<img src="assets/img/${cellImg(board[r][col])}">`;
              if (fgBonusSymbols && col === 1 && fgBonusSymbols[r] > 0) {
                div.innerHTML += `<span class="cell-bonus">💰${Math.round(gm.bet * fgBonusSymbols[r])}</span>`;
              }
              strip.appendChild(div);
            }
          }
          spinning = false;
          if (onSidesStop) onSidesStop();
          resolve();
          return;
        }
        const overshoot = Math.round(cellH * 0.05);
        const MID_SYMBOLS = 200;
        const sideScrollDist = REEL_SYMBOLS * cellH;
        const sideFastDur = 700;
        const highSpeed = sideScrollDist / sideFastDur;

        // Build side reels
        for (let col of [0, 2]) {
          buildStripN(col, [board[0][col], board[1][col], board[2][col]], REEL_SYMBOLS);
        }

        if (fgBonusSymbols) {
          // FG mode: all 3 columns use strip animation, mid uses single easeOut like Normal
          buildStripN(1, [board[0][1], board[1][1], board[2][1]], MID_SYMBOLS, fgBonusSymbols);
          let done = 0;
          // Side reels: fast + decel
          const fastDist = sideScrollDist - 9 * cellH;
          const fastDur = Math.round(fastDist / highSpeed);
          for (let col of [0, 2]) {
            const strip = document.querySelector(`#reel-${col} .reel-strip`);
            strip.style.transition = `transform ${fastDur}ms linear`;
            strip.style.transform = `translateY(-${9 * cellH}px)`;
            setTimeout(() => {
              strip.style.transition = `transform 1350ms cubic-bezier(0.22, 1, 0.36, 1)`;
              strip.style.transform = `translateY(${overshoot}px)`;
              setTimeout(() => {
                strip.style.transition = 'transform 90ms cubic-bezier(0.33, 1, 0.68, 1)';
                strip.style.transform = `translateY(0px)`;
                setTimeout(() => { done++; if (done === 3) { spinning = false; resolve(); } }, 100);
              }, 1350);
            }, fastDur);
          }
          // Trigger onSidesStop after sides settle
          setTimeout(() => { if (onSidesStop) onSidesStop(); }, fastDur + 1350 + 90 + 100);
          // Middle reel: single 5s easeOut
          const midStrip = document.querySelector('#reel-1 .reel-strip');
          midStrip.offsetHeight;
          midStrip.style.transition = `transform 5000ms cubic-bezier(0.1, 0.7, 0.3, 1)`;
          midStrip.style.transform = `translateY(0px)`;
          setTimeout(() => { done++; if (done === 3) { spinning = false; resolve(); } }, 5100);
        } else {
          // Normal mode: all 3 columns use strip animation (mid spins longer)
          buildStripN(1, [board[0][1], board[1][1], board[2][1]], MID_SYMBOLS);
          const configs = [
            { col: 0, scrollDist: sideScrollDist, decelDist: 9 * cellH, decelMs: 1350, ease: 'cubic-bezier(0.22, 1, 0.36, 1)' },
            { col: 1, scrollDist: MID_SYMBOLS * cellH, decelDist: 18 * cellH, decelMs: 2400, ease: 'cubic-bezier(0.16, 1, 0.3, 1)' },
            { col: 2, scrollDist: sideScrollDist, decelDist: 9 * cellH, decelMs: 1350, ease: 'cubic-bezier(0.22, 1, 0.36, 1)' },
          ];
          let sidesCount = 0;
          let done = 0;
          for (const cfg of configs) {
            const strip = document.querySelector(`#reel-${cfg.col} .reel-strip`);
            if (cfg.col === 1) {
              // Middle reel: force reflow then single easeOut curve
              strip.offsetHeight; // force reflow
              strip.style.transition = `transform 5000ms cubic-bezier(0.1, 0.7, 0.3, 1)`;
              strip.style.transform = `translateY(0px)`;
              setTimeout(() => { done++; if (done === 3) { spinning = false; resolve(); } }, 5100);
            } else {
              const fastDist = cfg.scrollDist - cfg.decelDist;
              const fastDur = Math.round(fastDist / highSpeed);
              strip.style.transition = `transform ${fastDur}ms linear`;
              strip.style.transform = `translateY(-${cfg.decelDist}px)`;
              setTimeout(() => {
                strip.style.transition = `transform ${cfg.decelMs}ms ${cfg.ease}`;
                strip.style.transform = `translateY(${overshoot}px)`;
                setTimeout(() => {
                  strip.style.transition = 'transform 90ms cubic-bezier(0.33, 1, 0.68, 1)';
                  strip.style.transform = `translateY(0px)`;
                  setTimeout(() => {
                    sidesCount++; if (sidesCount === 2 && onSidesStop) onSidesStop();
                    done++; if (done === 3) { spinning = false; resolve(); }
                  }, 100);
                }, cfg.decelMs);
              }, fastDur);
            }
          }
        }
      });
    }


    function buildStripN(col, finalCells, numSym, bonusSymbols) {
      const strip = document.querySelector(`#reel-${col} .reel-strip`);
      const cellH = getCellH();
      strip.innerHTML = '';
      strip.style.transition = 'none';
      // Final cells first (top), then randoms below
      for (let r = 0; r < 3; r++) {
        const div = document.createElement('div');

    const FG_SYMS = [0.33, 0.5, 0.83, 1.5, 2.5, 0];

    // JP Slot system — extreme narrow gate triggers JP symbols in middle reel
    const JP_NARROW_POOL = ['GRAND','MAJOR','MINI','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal']; // gap=1
    const JP_MID_POOL = ['MAJOR','MINI','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal'];   // gap≤3
    function getJpPool(gap) {
      if (gap === 1) return JP_NARROW_POOL;
      if (gap <= 3) return JP_MID_POOL;
      return null;
    }
    function pickJpSymbol(pool) {
      const p = [...pool];
      if (gm.bet >= 300) {
        const jpSyms = pool.filter(s => s !== 'normal');
        if (jpSyms.length > 0) p.push(jpSyms[Math.floor(Math.random() * jpSyms.length)]);
      }
      return p[Math.floor(Math.random() * p.length)];
    }
    function checkJpSlotWin(symbols) {
      // All 3 must be the same non-null JP symbol
      if (symbols[0] && symbols[0] !== 'normal' && symbols[0] === symbols[1] && symbols[1] === symbols[2]) return symbols[0];
      return null;
    }
    function getJpImg(sym) {
      if (sym === 'GRAND') return 'assets/img/GRAND.png';
      if (sym === 'MAJOR') return 'assets/img/MAJOR.png';
      if (sym === 'MINI') return 'assets/img/MINI.png';
      return null;
    }

    function flyFgCoins(judgments, bonusSymbols) {
      const flyers = [];
      for (const j of judgments) {
        if (j.type !== 'through' || bonusSymbols[j.row] === 0) continue;
        const cell = document.getElementById(`cell-${j.row}-1`);
        const badge = $(`badge-${j.row}`);
        const src = cell && cell.querySelector('.cell-bonus');
        if (!src || !badge) continue;
        const srcRect = src.getBoundingClientRect();
        const dstRect = badge.getBoundingClientRect();
        const flyer = document.createElement('span');
        flyer.textContent = `💰${Math.round(gm.bet * bonusSymbols[j.row])}`;
        flyer.style.cssText = `position:fixed;left:${srcRect.left}px;top:${srcRect.top}px;z-index:9999;font-size:13px;color:#ffd700;font-weight:bold;background:rgba(0,0,0,0.7);border-radius:8px;padding:2px 6px;transition:all 600ms cubic-bezier(0.25,1,0.5,1);pointer-events:none;`;
        document.body.appendChild(flyer);
        flyers.push({ clone: flyer, dstRect, badge, sym: bonusSymbols[j.row] });
        sfx('coin_fly');
        requestAnimationFrame(() => {
          flyer.style.left = `${dstRect.left + dstRect.width/2 - 20}px`;
          flyer.style.top = `${dstRect.top + dstRect.height/2 - 10}px`;
          flyer.style.transform = 'scale(1.3)';
          flyer.style.opacity = '0.8';
        });
      }
      if (flyers.length === 0) return Promise.resolve();
      return new Promise(resolve => {
        setTimeout(() => {
          for (const f of flyers) {
            f.clone.remove();
            const amt = Math.round(gm.bet * f.sym);
            f.badge.textContent = `💰${fmt(amt)}`;
            f.badge.className = `badge badge-${f.badge.id.slice(-1)} win`;
          }
          resolve();
        }, 650);
      });
    }

    function bgDeal() {
      if (!bgInstance || !bgInstance.active) return;
      sfx('card_deal');
      if (bgRoundTimer) clearInterval(bgRoundTimer);
      $('bg-deal-btn').disabled = true;
      $('bg-chip-btns').querySelectorAll('.bg-chip-btn').forEach(b => { b.disabled = true; });
      // Flip animation
      const midCard = $('bg-card-m');
      midCard.classList.add('flip');
      setTimeout(() => {
        if (!bgInstance) return; // guard against race with bgEnd
        const result = bgInstance.reveal();
        midCard.innerHTML = `<img src="assets/img/${CARD_IMG[result.mid]}">`;
        midCard.className = 'bg-card face';
        const resEl = $('bg-result-text');
        const winEl = $('bg-win');
        const balEl = $('bg-balance');
        if (result.mult > 0) {
          const winBefore = bgInstance.winnings;
          bgInstance.applyResult(result);
          const won = bgInstance.winnings - winBefore;
          resEl.textContent = '穿門!';
          resEl.className = 'bg-result-text win';
          sfx('gate_through');
          bgAnimateValue(winEl, '', winBefore, bgInstance.winnings, 900, true);
          bgAnimateValue(balEl, '', bgInstance.chips - won, bgInstance.chips, 900, false);
        } else {
          const wasAllIn = bgInstance.roundBet >= bgInstance.chips;
          const chipsBefore = bgInstance.chips;
          const winBefore = bgInstance.winnings;
          bgInstance.applyResult(result);
          if (result.type === 'wall') { resEl.textContent = '碰壁！'; sfx('wall_hit'); }
          else if (result.type === 'same-hit') { resEl.textContent = '同值撞柱！'; sfx('wall_hit'); }
          else { resEl.textContent = '未穿'; }
          resEl.className = 'bg-result-text lose';

    const bgCountSfx = new Audio('assets/sfx/countup.mp3');
    bgCountSfx.loop = true; bgCountSfx.volume = 0.4;
    function bgAnimateValue(el, prefix, from, to, duration, isWin) {
      if (isWin) { bgCountSfx.currentTime = 0; bgCountSfx.play().catch(()=>{}); }
      else { sfx('lose'); }
      const t0 = performance.now();
      function tick(now) {
        const p = Math.min((now - t0) / duration, 1);
        const ease = 1 - Math.pow(1 - p, 3);
        el.textContent = prefix + fmt(Math.round(from + (to - from) * ease));
        if (p < 1) requestAnimationFrame(tick);
        else if (isWin) bgCountSfx.pause();
      }
      requestAnimationFrame(tick);
    }

    async function showBGResult(total, isGuaranteed) {
      const ratio = total / gm.bet;
      if (ratio >= 5) {
        const label = ratio >= 30 ? 'SUPER MEGA WIN!' : ratio >= 15 ? 'MEGA WIN!' : 'BIG WIN!';
        const colors = ratio >= 30 ? '#ffd700,#ff8c00' : ratio >= 15 ? '#c0c0c0,#808080' : '#cd7f32,#8b4513';
        gm.balance += total;
        await showBigWin(total, label, colors);
        updateUI(); updateRing(0);
        return;
      }
      const overlay = $('fg-result-overlay');
      const amountEl = $('fg-result-amount');
      const bigEl = $('fg-result-big');
      const titleEl = overlay.querySelector('.fg-result-title');
      titleEl.textContent = isGuaranteed ? 'BONUS GAME（保底）' : 'BONUS GAME';
      overlay.style.display = 'flex';
      bigEl.style.display = 'none';
      amountEl.textContent = '0';
      const duration = 2000, start = performance.now();
      function tick(now) {
        const p = Math.min((now - start) / duration, 1);
        amountEl.textContent = fmt(Math.round(total * p));
        if (p < 1) requestAnimationFrame(tick);
        else sfx('coin_count');
      }
      requestAnimationFrame(tick);
      const close = () => {
        overlay.style.display = 'none';
        titleEl.textContent = 'FREE GAME';
        gm.balance += total;
        updateUI(); updateRing(0);
      };
      overlay.onclick = close;
      setTimeout(close, 3500);
    }

    async function doSpin() {
      if (spinning || compSubmitted) return;
      if (!gm.canSpin()) {
        autoStopped = true; autoSpins = 0; updateUI();
        const ov = document.createElement('div');
        ov.style.cssText = 'position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;pointer-events:none;';
        ov.innerHTML = '<div style="color:#fff;font-size:1.5rem;font-weight:bold;">No more money!</div>';
        document.body.appendChild(ov);

        return;
      }
      // 清除殘留動畫元素（防止記憶體洩漏）
      document.querySelectorAll('.win-sweep, .win-particle, .coin-rain, .coin-burst, .dragon-sweep, .sc-darken, .sc-hint-text').forEach(el => el.remove());
      document.querySelectorAll('[style*="position: fixed"][style*="z-index"]').forEach(el => { if(parseInt(el.style.zIndex)>9000) el.remove(); });
      document.querySelectorAll('.cell').forEach(c => { c.style.backgroundColor=''; c.style.boxShadow=''; c.style.transform=''; });
      for (let r = 0; r < 3; r++) { $(`badge-${r}`).textContent = ''; $(`badge-${r}`).className = 'badge badge-' + r; }
      const isFG = gm.fg.active;
      sfx('spin_charge');
      updateUI();
      const result = gm.executeSpin();
      if (!result) return;
      // Debug: force narrow gate for JP testing
      if (window._debugForceNarrow && result.mode === 'normal') {
        const gapSize = window._debugJpNext === 'GRAND' ? 2 : window._debugJpNoWin ? 3 : 3;
        for (let r = 0; r < 3; r++) {
          const base = 2 + Math.floor(Math.random() * (11 - gapSize));
          result.board[r][0] = { value: base, isScatter: false };
          result.board[r][2] = { value: base + gapSize, isScatter: false };
          result.board[r][1] = { value: base + 1, isScatter: false };
        }
        result.judgments = judgeBoard(result.board);
        result.totalPayout = 0;
        for (const j of result.judgments) {
          if (j.type === 'through') result.totalPayout += (gm.bet / 3) * j.mult;
        }
        window._debugForceNarrow = false;
        window._debugJpNoWin = false;
      }
      // Debug: force scatter to fill progress to threshold
      if (window._debugForceScatter && result.mode === 'normal') {
        const threshold = 10;
        // Override: force exactly 1 scatter, set lamps to threshold-1 so it triggers
        gm.scatterLamps = threshold - 1;
        // Place exactly 1 scatter on the board
        let placed = false;
        for (let r = 0; r < 3 && !placed; r++) {
          for (let c = 0; c < 3 && !placed; c++) {
            if (!result.board[r][c].isScatter) {
              result.board[r][c] = { value: null, isScatter: true };
              placed = true;
            }
          }
        }
        result.judgments = judgeBoard(result.board);
        result.scatterCount = 1;
        gm.scatterLamps = threshold; // now at 10
        result.fgTriggered = true;
        result.scatterLamps = threshold;
        result.totalPayout = 0;
        for (const j of result.judgments) {
          if (j.type === 'through') result.totalPayout += (gm.bet / 3) * j.mult;
        }
        window._debugForceScatter = false;
      }
      if (result.mode === 'fg') {
        await animateSpin(result.board, result.bonusSymbols, () => {
          document.getElementById('reel-1').style.animation = 'jpFlash 0.15s infinite alternate';
        });
        document.getElementById('reel-1').style.animation = '';
        sfx('spin_release');
        // Fly coin from mid-column to badge (non-blocking in FG)
        flyFgCoins(result.judgments, result.bonusSymbols);
        await new Promise(r => setTimeout(r, 700));
        $('win').textContent = fmt(result.totalScore);
        updateUI();
        if (result.fgDone) { await showFGResult(result.totalScore); tryEndCompetition(); }
        else { setTimeout(() => doSpin(), 400); }
        return result;
      }
      // Normal mode: determine JP symbols per-row, pass onSidesStop callback
      let jpSlotWin = null;
      let jpPerRow = [null, null, null]; // per-row JP symbol (null = normal)
      if (window._debugJpNext) {
        if (window._debugJpNext === 'FORCE_NO_WIN') {
          jpPerRow = ['GRAND', 'MINI', 'MAJOR'];
        } else {
          jpPerRow = [window._debugJpNext, window._debugJpNext, window._debugJpNext];
        }
        window._debugJpNext = null;
        console.log("[DEBUG JP] jpPerRow set to:", jpPerRow);
      }
      await animateSpin(result.board, null, () => {
        // Sides stopped — per-row JP determination
        if (jpPerRow.every(x => x === null)) {
          const allNarrowJp = result.judgments.every(j => j.type !== 'scatter' && j.type !== 'same-hit' && j.type !== 'same-miss' && j.gap >= 1 && j.gap <= 3);
          if (allNarrowJp && jpPerRow.every(x => x === null)) {
            const minGap = Math.min(...result.judgments.map(j => j.gap));
            const jpOnly = minGap === 1 ? ['GRAND','MAJOR','MINI'] : ['MAJOR','MINI'];
            for (let r = 0; r < 3; r++) jpPerRow[r] = jpOnly[Math.floor(Math.random() * jpOnly.length)];
            console.log('[JP] All narrow! Per-row:', jpPerRow);
          }
        }
        if (jpPerRow.some(x => x !== null)) {
          sfx('narrow_gate');
          // Add JP badges to mid column final cells
          for (let r = 0; r < 3; r++) {
            if (jpPerRow[r] && jpPerRow[r] !== 'normal') {
              const cell = document.getElementById(`cell-${r}-1`);
              if (cell) cell.innerHTML += `<img src="${getJpImg(jpPerRow[r])}" style="position:absolute;bottom:2px;right:2px;width:48px;height:48px;z-index:5;object-fit:contain;">`;
            }
          }
          // Inject JP badges into ALL spinning strip cells
          const midStrip = document.querySelector('#reel-1 .reel-strip');
          const cells = midStrip.querySelectorAll('.cell');
          const minGap2 = Math.min(...result.judgments.map(j => j.gap));
          const jpOnly2 = minGap2 === 1 ? ['GRAND','MAJOR','MINI'] : ['MAJOR','MINI'];
          cells.forEach(c => {
            if (c.id) return; // skip final cells (already set by jpPerRow)
            const sym = jpOnly2[Math.floor(Math.random() * jpOnly2.length)];
            const img = getJpImg(sym);
            if (img) c.innerHTML += `<img src="${img}" style="position:absolute;bottom:2px;right:2px;width:48px;height:48px;z-index:5;object-fit:contain;">`;
          });
        }
        // Always flash middle reel (unified effect for all gate types)
        const midReel = document.getElementById('reel-1');
        midReel.style.animation = 'jpFlash 0.15s infinite alternate';
      });
      sfx('spin_release');
      // Clear mid reel flash after stop (unless JP win)
      const midReelPost = document.getElementById('reel-1');
      if (jpPerRow.some(x => x !== null)) {
        jpSlotWin = checkJpSlotWin(jpPerRow);
        if (!jpSlotWin) { midReelPost.style.animation = ''; }
        for (let r = 0; r < 3; r++) {
          if (jpPerRow[r] && jpPerRow[r] !== 'normal') {
            result.judgments[r] = { row: r, type: jpSlotWin ? 'jp-win' : 'jp-none', lampChange: 0, gap: result.judgments[r].gap };
          }
        }
        let recalcWin = 0, recalcRefund = 0;
        for (const j of result.judgments) {
          if (j.type === 'through') { recalcWin += (gm.bet / 3) * j.mult; recalcRefund += gm.bet / 3; }
        }
        const oldTotal = result.totalPayout + result._refund;
        const newTotal = recalcWin + recalcRefund;
        gm.balance += newTotal - oldTotal;
        result.totalPayout = recalcWin;
        result._refund = recalcRefund;
      } else {
        midReelPost.style.animation = '';
      }
      showResult(result);
      // Play result sfx + win line effect
      if (result.mode === 'normal') {
        // Scatter first (top-to-bottom, left-to-right), with fly to collector
        if (result.scatterCount > 0) await revealScatters(result.board, result.scatterCount);
        // Wall hits — await each so the effect is visible
        for (const j of result.judgments) {
          if (j.type === 'wall' || j.type === 'same-hit') await playWallHit(j.row);
        }
        updateRing(gm.scatterLamps);
        for (const j of result.judgments) {
          if (j.type === 'through') sfx('gate_through');
        }
        if (result.totalPayout > 0) sfx('coin_count');
        if (result.fgTriggered) sfx('gate_open');
        const winRows = result.judgments
          .filter(j => j.type === 'through')
          .map(j => ({ row: j.row, badgeEl: $(`badge-${j.row}`) }));
        if (winRows.length > 0) await playWinLines(winRows);
        // JP Slot win
        if (jpSlotWin) {
          // Fly JP badges to JP pool
          sfx('coin_fly');
          for (let r = 0; r < 3; r++) {
            const cell = document.getElementById(`cell-${r}-1`);
            const targetEl = document.getElementById(`badge-${r}`);
            if (!cell || !targetEl) continue;
            const srcRect = cell.getBoundingClientRect();
            const dstRect = targetEl.getBoundingClientRect();
            const dstX = dstRect.left + dstRect.width/2 - 10;
            const dstY = dstRect.top + dstRect.height/2 - 10;
            const flyer = document.createElement('img');
            flyer.src = getJpImg(jpSlotWin);
            flyer.style.cssText = `position:fixed;left:${srcRect.left}px;top:${srcRect.top}px;width:48px;height:48px;z-index:9999;object-fit:contain;transition:all 500ms cubic-bezier(0.25,1,0.5,1);pointer-events:none;`;
            document.body.appendChild(flyer);
            setTimeout(() => { flyer.style.left = dstX+'px'; flyer.style.top = dstY+'px'; flyer.style.width = '20px'; flyer.style.height = '20px'; }, r * 150);
            setTimeout(() => { flyer.style.transition = 'all 300ms ease-out'; flyer.style.width = '48px'; flyer.style.height = '48px'; flyer.style.left = (dstX-14)+'px'; flyer.style.top = (dstY-14)+'px'; }, 500 + r * 150);
            setTimeout(() => { flyer.remove(); const b = document.getElementById(`badge-${r}`); if(b) b.innerHTML = `<img src="${getJpImg(jpSlotWin)}" style="width:100%;height:100%;object-fit:contain;">`; }, 800 + r * 150);
          }
          await new Promise(res => setTimeout(res, 1800));
          const jpAmount = jpSlotWin === 'GRAND' ? jpGrand : jpSlotWin === 'MAJOR' ? jpMajor : jpMini;
          gm.balance += jpAmount;
          if (jpSlotWin === 'GRAND') jpGrand = 30000;
          else if (jpSlotWin === 'MAJOR') jpMajor = 6000;
          else jpMini = 1500;
          const jpSubLabel = jpSlotWin === 'GRAND' ? 'SUPER MEGA WIN!' : jpSlotWin === 'MAJOR' ? 'MEGA WIN!' : 'BIG WIN!';
          await showBigWin(jpAmount, 'JACKPOT!\n' + jpSubLabel, '#ffd700,#ff8c00');
          // Clear JP flash after showing result
          const mr = document.getElementById('reel-1');
          if (mr) mr.style.animation = '';
        }
      }
      // BIG WIN check (skip if JP already showing its own overlay)
      if (result.mode === 'normal' && !jpSlotWin && result.totalPayout > 0) {
        const ratio = result.totalPayout / gm.bet;
        if (ratio >= 5) await showBigWin(result.totalPayout, ratio >= 30 ? 'SUPER MEGA WIN!' : ratio >= 15 ? 'MEGA WIN!' : 'BIG WIN!', ratio >= 30 ? '#ffd700,#ff8c00' : ratio >= 15 ? '#e8e8e8,#b0b0b0' : '#e8a04a,#cd7f32');
      }
      // Debug B key: force BIG WIN display
      if (window._debugForceBigWin && result.mode === 'normal') {
        const lvl = window._debugForceBigWin;
        window._debugForceBigWin = false;
        if (lvl === 'super') await showBigWin(gm.bet * 30, 'SUPER MEGA WIN!', '#ffd700,#ff8c00');
        else if (lvl === 'mega') await showBigWin(gm.bet * 15, 'MEGA WIN!', '#e8e8e8,#b0b0b0');
        else await showBigWin(gm.bet * 5, 'BIG WIN!', '#e8a04a,#cd7f32');
      }
      updateUI();
      if (result.fgTriggered || (result.mode === 'fg' && gm.fg.active)) {
        if (result.fgTriggered) { autoStopped = true; autoSpins = 0; await playDragonGateOpening(); showFgBgChoice(); gm.scatterLamps = 0; }
        else { setTimeout(() => doSpin(), 400); }
      }
      tryEndCompetition();
      return result;
    }

    }

    async function endCompetition() {
      if (compSubmitted) return;
      compSubmitted = true;
      $('comp-timer').textContent = '時間到！';
      autoStopped = true; autoSpins = 0;
      const finalScore = gm.balance;
      try { await fetch(API_BASE, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({name: '\u200B' + playerName, score: finalScore}) }); } catch(e) {}
      await new Promise(r => setTimeout(r, 1000));
      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;align-items:center;padding:24px;overflow-y:auto;';
      ov.innerHTML = `<div style="color:#ffd700;font-size:1.4rem;font-weight:bold;margin:16px 0;">⏰ 時間到！</div><div style="color:#fff;margin-bottom:4px;">你的分數</div><div style="color:#ffd700;font-size:2.2rem;font-weight:bold;margin-bottom:16px;">${fmt(finalScore)}</div><div style="color:#ffd700;font-size:1.1rem;font-weight:bold;margin-bottom:8px;">🏆 排行榜</div><div id="comp-lb" style="width:100%;max-width:360px;"></div>`;
      document.body.appendChild(ov);
      async function refreshLb() {
        try {
          const resp = await fetch(API_BASE);
          const data = await resp.json();
          const medals = ['','🥇','🥈','🥉'];
          const lb = document.getElementById('comp-lb');
          if (!data.scores || !data.scores.length) { lb.innerHTML = '<div style="color:#666;text-align:center;">尚無紀錄</div>'; return; }
          lb.innerHTML = data.scores.map((s,i) => {
            const isMe = s.name.replace(/\u200B/g,'') === playerName && s.score === finalScore;
            const bg = isMe ? 'background:rgba(255,215,0,0.15);border:1px solid #ffd700;' : 'border:1px solid #333;';
            const medal = medals[i+1] || '';
            const tag = isMe ? ' <span style="color:#ffd700;font-size:0.75rem;">← 你</span>' : '';
            return `<div style="${bg}border-radius:6px;padding:8px 12px;margin:4px 0;display:flex;justify-content:space-between;align-items:center;"><span style="color:#aaa;">#${i+1} ${medal} ${s.name.replace(/\u200B/g,'')}${tag}</span><span style="color:#ffd700;font-weight:bold;">${Math.round(s.score).toLocaleString()}</span></div>`;
          }).join('');
        } catch(e) {}
      }
      refreshLb();
      setInterval(refreshLb, 5000);
    }
    $('vol-btn').addEventListener('click', () => {
      muted = !muted;
      $('vol-btn').classList.toggle('muted', muted);
      $('vol-btn').innerHTML = muted
        ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>'
        : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.08"/></svg>';
      bgm.volume = muted ? 0 : 0.3;
    });
    $('turbo-btn').addEventListener('click', () => {
      turbo = !turbo;
      $('turbo-btn').classList.toggle('active', turbo);
      $('turbo-btn').style.background = turbo ? 'rgba(255,215,0,0.25)' : '';
    });
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && !e.repeat) { e.preventDefault(); doSpin(); }
      if (e.key === 'f' && !gm.fg.active && !spinning) { gm.scatterLamps = 9; updateRing(9); window._debugForceScatter = true; }
      if (e.key === 'b' || e.key === 'B') { window._debugForceBigWin = 'big'; }
      if (e.key === 'v' || e.key === 'V') { window._debugForceBigWin = 'mega'; }
      if (e.key === 'x' || e.key === 'X') { window._debugForceBigWin = 'super'; }
      let debugJpNext = null; // 'GRAND'|'MAJOR'|'MINI'
      if (e.key === 'j' || e.key === 'J') { debugJpNext = 'GRAND'; }
      if (e.key === 'm' || e.key === 'M') { debugJpNext = 'MAJOR'; }
      if (e.key === 'n' || e.key === 'N') { debugJpNext = 'MINI'; }
      if (e.key === 'k' || e.key === 'K') { window._debugJpNoWin = true; window._debugForceNarrow = true; window._debugJpNext = 'FORCE_NO_WIN'; }
      if (debugJpNext) { window._debugJpNext = debugJpNext; window._debugForceNarrow = true; }
    });
    $('fgbg-close').addEventListener('click', () => { $('fgbg-choice').style.display = 'none'; });

    // JP Pool auto-climb — independent timers per tier
    let jpGrand = 30000, jpMajor = 6000, jpMini = 1500;
    function animateJp(el, start, end, duration) {
      const range = end - start;
      const t0 = performance.now();
      function step(now) {
        const t = Math.min((now - t0) / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        el.textContent = Math.round(start + range * ease).toLocaleString();
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    const grandEl = $('jp-grand-val'), majorEl = $('jp-major-val'), miniEl = $('jp-mini-val');
    grandEl.textContent = jpGrand.toLocaleString();
    majorEl.textContent = jpMajor.toLocaleString();
    miniEl.textContent = jpMini.toLocaleString();
    (function tickMini() {
      setTimeout(() => {
        const prev = jpMini;
        jpMini += Math.ceil(Math.random() * 5);
        if (jpMini >= jpMajor) jpMini = 1500;
        animateJp(miniEl, prev, jpMini, 800);
        tickMini();
      }, 2000 + Math.random() * 2000);
    })();
    (function tickMajor() {
      setTimeout(() => {
        const prev = jpMajor;
        jpMajor += 3 + Math.floor(Math.random() * 6);
        if (jpMajor >= jpGrand) jpMajor = 6000;
        animateJp(majorEl, prev, jpMajor, 800);
        tickMajor();
      }, 5000 + Math.random() * 5000);
    })();
    (function tickGrand() {
      setTimeout(() => {
        const prev = jpGrand;
        jpGrand += 5 + Math.floor(Math.random() * 11);
        animateJp(grandEl, prev, jpGrand, 800);
        tickGrand();
      }, 10000 + Math.random() * 10000);
    })();

    // Mobile debug panel (long press 2s)
    (function(){
      let lpt;
      document.addEventListener('touchstart', () => { lpt = setTimeout(showDbg, 2000); });
      document.addEventListener('touchend', () => clearTimeout(lpt));
      document.addEventListener('touchmove', () => clearTimeout(lpt));
      function showDbg() {
        const d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;background:rgba(0,0,0,0.9);border:2px solid #ffd700;border-radius:12px;padding:16px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;';
        const btns = [['F','f'],['B','b'],['V','v'],['X','x'],['J','j'],['M','m'],['N','n'],['K','k'],['S','s']];
        btns.forEach(([label, key]) => {
          const b = document.createElement('button');
          b.textContent = label;
          b.style.cssText = 'width:44px;height:44px;border-radius:50%;border:2px solid #ffd700;background:#222;color:#ffd700;font-size:16px;font-weight:bold;cursor:pointer;';
          b.onclick = () => { document.dispatchEvent(new KeyboardEvent('keydown',{key})); d.remove(); };
          d.appendChild(b);
        });
        const close = document.createElement('button');
        close.textContent = '✕';
        close.style.cssText = 'width:44px;height:44px;border-radius:50%;border:1px solid #666;background:#333;color:#fff;font-size:16px;cursor:pointer;';
        close.onclick = () => d.remove();
        d.appendChild(close);
        document.body.appendChild(d);
      }
    })();

    window.focus();
  </script>
</body>
</html>
