<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>射龍門 Slot</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div class="game-root">
    <img class="bg-layer" src="assets/img/BG.png" alt="">
    <img class="bg-bonus" id="bg-bonus" src="assets/img/BG-bonus.png" style="display:none" alt="">

    <!-- Jackpot Pool -->
    <div class="jp-pool-container">
      <img class="jp-pool" src="assets/img/JP-pool.png" alt="Jackpot Pool">
      <div class="jp-values">
        <span class="jp-val" id="jp-grand-val">3,000</span>
        <span class="jp-val" id="jp-major-val">500</span>
        <span class="jp-val" id="jp-mini-val">100</span>
      </div>
    </div>

    <!-- 3 Reel containers (absolute positioned on BG grid) -->
    <div class="reel" id="reel-0"><div class="reel-strip"></div></div>
    <div class="reel" id="reel-1"><div class="reel-strip"></div></div>
    <div class="reel" id="reel-2"><div class="reel-strip"></div></div>

    <!-- Badges -->
    <div class="badge badge-0" id="badge-0"></div>
    <div class="badge badge-1" id="badge-1"></div>
    <div class="badge badge-2" id="badge-2"></div>

    <!-- FG Bonus Reel -->
    <div class="fg-reel" id="fg-reel" style="display:none">
      <div class="fg-reel-strip" id="fg-reel-strip"></div>
    </div>

    <img class="mascot-dragon" src="assets/img/MS-01_mascot_dragon.png" alt="mascot">

    <!-- Bottom Control Panel -->
    <div class="ctrl-panel">
      <div class="ctrl-info-cell" id="cell-balance">
        <span class="ctrl-label">BALANCE</span>
        <span class="ctrl-val" id="balance">1,000</span>
      </div>
      <button class="ctrl-auto-upper" id="auto-btn">AUTO</button>
      <button class="spin-btn" id="spin-btn">SPIN</button>
      <div class="ctrl-bet-group">
        <span class="ctrl-label">BET</span>
        <span class="ctrl-val" id="bet">10</span>
      </div>
      <button class="ctrl-adj" id="bet-dec">−</button>
      <button class="ctrl-adj" id="bet-inc">+</button>
      <div class="ctrl-info-cell" id="cell-win">
        <span class="ctrl-label">WIN</span>
        <span class="ctrl-val" id="win">0</span>
      </div>
      <div class="ctrl-action-row">
        <button class="ctrl-func" id="vol-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.08"/></svg>
        </button>
        <button class="ctrl-func" id="turbo-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </button>
        <button class="ctrl-func" id="rules-btn">i</button>
      </div>
    </div>

    <!-- BG Control Panel (hidden by default) -->
    <div class="ctrl-panel" id="bg-ctrl-panel" style="display:none">
      <div class="ctrl-info-cell" style="position:absolute;left:7.7%;top:87.9%;">
        <span class="ctrl-label">BALANCE</span>
        <span class="ctrl-val" id="bg-balance">0</span>
      </div>
      <div class="ctrl-info-cell" style="position:absolute;left:26.7%;top:87.9%;">
        <span class="ctrl-label">ROUND</span>
        <span class="ctrl-val" id="bg-round-timer">15</span>
      </div>
      <button class="spin-btn" id="bg-deal-btn" disabled>DEAL</button>
      <div class="ctrl-bet-group">
        <span class="ctrl-label">局數</span>
        <span class="ctrl-val" id="bg-round-counter">0/12</span>
      </div>
      <div class="ctrl-info-cell" style="position:absolute;left:80.8%;top:87.9%;">
        <span class="ctrl-label">WIN</span>
        <span class="ctrl-val" id="bg-win">0</span>
      </div>
      <div class="ctrl-action-row">
        <button class="ctrl-func" id="bg-vol-btn" style="left:9.7%;width:11.8%;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.08"/></svg>
        </button>
        <button class="ctrl-func" id="bg-turbo-btn" style="left:24%;width:11.8%;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </button>
        <button class="ctrl-func" id="bg-rules-btn" style="left:79.5%;width:8.7%;">i</button>
      </div>
    </div>

    <!-- FG info -->
    <div class="fg-info" id="fg-info" style="display:none"></div>
    <div class="results-bar" id="results"></div>

    <!-- FG Result Overlay -->
    <div class="fg-result-overlay" id="fg-result-overlay" style="display:none">
      <div class="fg-result-panel">
        <div class="fg-result-title">FREE GAME</div>
        <div class="fg-result-big" id="fg-result-big" style="display:none">BIG WIN!</div>
        <div class="fg-result-label">總贏分</div>
        <div class="fg-result-amount" id="fg-result-amount">0</div>
      </div>
    </div>

    <!-- Bonus Game (inline on game-root, not overlay) -->
    <div class="bg-inline" id="bg-inline" style="display:none">
      <div class="bg-cards">
        <div class="bg-card face" id="bg-card-l">?</div>
        <div class="bg-card back" id="bg-card-m">🐉</div>
        <div class="bg-card face" id="bg-card-r">?</div>
      </div>
      <div class="bg-gate-info" id="bg-gate-info"></div>
      <div class="bg-result-text" id="bg-result-text"></div>
    </div>
    <!-- BG chip buttons (replaces bet area) -->
    <div class="bg-chip-bar" id="bg-chip-bar" style="display:none">
      <div class="bg-chip-btns" id="bg-chip-btns"></div>
    </div>

    <!-- FG/BG Choice Overlay -->
    <div class="fg-result-overlay" id="fgbg-choice" style="display:none">
      <div class="fg-result-panel" style="position:relative;">
        <button class="rules-close" id="fgbg-close" style="position:absolute;top:-30px;right:-10px;">✕</button>
        <div class="fg-result-title">選擇獎勵模式</div>
        <div style="display:flex;flex-direction:column;gap:1rem;margin-top:1.5rem;width:100%;padding:0 1rem;pointer-events:auto;position:relative;z-index:9999;">
          <button class="bg-deal-btn" id="choose-fg" style="background:linear-gradient(135deg,#1a8c5c,#2ecc71);padding:1rem;pointer-events:auto;">FREE GAME <span id="info-fg" style="cursor:pointer;margin-left:6px;display:inline-flex;align-items:center;justify-content:center;width:1.2em;height:1.2em;background:#FFD700;color:#5A2600;font-size:0.75em;font-weight:bold;">i</span></button>
          <button class="bg-deal-btn" id="choose-bg" style="padding:1rem;pointer-events:auto;">BONUS GAME <span id="info-bg" style="cursor:pointer;margin-left:6px;display:inline-flex;align-items:center;justify-content:center;width:1.2em;height:1.2em;background:#FFD700;color:#5A2600;font-size:0.75em;font-weight:bold;">i</span></button>
        </div>
      </div>
    </div>

    <!-- FG/BG Info Overlay -->
    <div class="rules-overlay" id="choice-info-overlay" style="display:none;z-index:2100">
      <div class="rules-panel" style="width:80%;max-height:60vh;">
        <button class="rules-close" id="choice-info-close">✕</button>
        <div class="rules-content" id="choice-info-content"></div>
      </div>
    </div>

    <!-- Scatter Progress Ring -->
    <div class="scatter-ring" id="scatter-ring">
      <div class="ring-bg"></div>
      <svg class="ring-svg" viewBox="0 0 100 100">
        <defs>
          <filter id="glow-filter" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
            <feFlood flood-color="#00ffc8" flood-opacity="0.7" result="color"/>
            <feComposite in="color" in2="blur" operator="in" result="glow"/>
            <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g id="ring-segments"></g>
        <g id="ring-glow" filter="url(#glow-filter)"></g>
      </svg>
      <div class="ring-orb" id="ring-orb"></div>
      <img class="ring-icon" src="assets/img/SC-01_scatter_dragon.png" alt="scatter">
      <span class="ring-label" id="ring-label">0/10</span>
    </div>

    <!-- JP hidden -->
    <span id="jp-basic" style="display:none">500</span>
    <span id="jp-major" style="display:none">2000</span>
    <span id="jp-grand" style="display:none">10000</span>
  </div>

  <!-- Rules Panel -->
  <div class="rules-overlay" id="rules-overlay" style="display:none">
    <div class="rules-panel">
      <button class="rules-close" id="rules-close">✕</button>
      <div class="rules-tabs">
        <button class="rules-tab active" data-page="0">玩法</button>
        <button class="rules-tab" data-page="1">計分</button>
        <button class="rules-tab" data-page="2">Free Game</button>
      </div>
      <div class="rules-content" id="rules-content"></div>
    </div>
  </div>

  <!-- Auto Panel -->
  <div class="auto-overlay" id="auto-overlay" style="display:none">
    <div class="auto-panel">
      <div class="auto-stepper">
        <button class="ctrl-adj" id="auto-dec">−</button>
        <span id="auto-count-display">50 局</span>
        <button class="ctrl-adj" id="auto-inc">+</button>
      </div>
      <div class="auto-actions">
        <button class="auto-start" id="auto-start">開始</button>
        <button class="auto-cancel" id="auto-cancel">取消</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { spin, countScatters } from './js/slotEngine.js';
    import { GameManager } from './js/gameManager.js';
    import { BonusGame } from './js/bonusGame.js';
    import { playSfx } from './js/effects/sfxBus.js';
    import { playWinLines } from './js/effects/winLine.js';
    import { playWallHit } from './js/effects/wallHit.js';
    import { revealScatters } from './js/effects/scatterReveal.js';

    let muted = false;
    let turbo = false;
    function sfx(name) { if (!muted) playSfx(name); }

    // === BGM ===
    const bgm = new Audio('assets/audio/bgm.mp3');
    bgm.loop = true;
    bgm.volume = 0.3;
    function startBGM() { bgm.play().catch(() => {}); }
    document.addEventListener('click', startBGM, { once: true });
    document.addEventListener('keydown', startBGM, { once: true });

    const gm = new GameManager();
    const $ = id => document.getElementById(id);
    let spinning = false;

    // Build scatter ring segments (10 arcs with gaps)
    (function initRing() {
      const g = $('ring-segments');
      const R = 47, SEG = 10, GAP = 4;
      const arcLen = (360 - GAP * SEG) / SEG;
      for (let i = 0; i < SEG; i++) {
        const startAngle = i * (arcLen + GAP);
        const endAngle = startAngle + arcLen;
        const s = startAngle * Math.PI / 180, e = endAngle * Math.PI / 180;
        const x1 = 50 + R * Math.cos(s), y1 = 50 + R * Math.sin(s);
        const x2 = 50 + R * Math.cos(e), y2 = 50 + R * Math.sin(e);
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${x1} ${y1} A ${R} ${R} 0 0 1 ${x2} ${y2}`);
        path.setAttribute('class', 'ring-segment');
        path.dataset.idx = i;
        g.appendChild(path);
      }
    })();

    function updateRing(count) {
      const segs = document.querySelectorAll('.ring-segment');
      const glowG = $('ring-glow');
      glowG.innerHTML = '';
      segs.forEach((s, i) => {
        const active = i < count;
        s.classList.toggle('active', active);
        s.removeAttribute('filter');
        if (active) {
          const clone = s.cloneNode(true);
          clone.setAttribute('stroke', '#ffd700');
          clone.setAttribute('stroke-width', '9');
          glowG.appendChild(clone);
        }
      });
      $('ring-label').textContent = `${count}/10`;
      // Position orb at end of progress
      const orb = $('ring-orb');
      if (count === 0) { orb.style.display = 'none'; return; }
      orb.style.display = 'block';
      const SEG = 10, GAP = 4, arcLen = (360 - GAP * SEG) / SEG;
      const angle = (count * (arcLen + GAP) - GAP / 2) - 90;
      const rad = angle * Math.PI / 180;
      const R = 47;
      orb.style.left = `${50 + R * Math.cos(rad) - 6}%`;
      orb.style.top = `${50 + R * Math.sin(rad) - 6}%`;
    }
    let autoSpins = 0, autoStopped = false, autoCount = 50;

    const CARD_IMG = {
      1:'CD-01_ace.png',2:'CD-05_num2.png',3:'CD-06_num3.png',
      4:'CD-07_num4.png',5:'CD-08_num5.png',6:'CD-09_num6.png',
      7:'CD-10_num7.png',8:'CD-11_num8.png',9:'CD-12_num9.png',
      10:'CD-13_num10.png',11:'CD-04_jack.png',12:'CD-03_queen.png',13:'CD-02_king.png'
    };
    const SC_IMG = 'SC-01_scatter_dragon.png';
    const ALL_IMGS = Object.values(CARD_IMG);
    const REEL_SYMBOLS = 30;

    function cellImg(cell) { return cell.isScatter ? SC_IMG : CARD_IMG[cell.value]; }
    function randomImg() { return ALL_IMGS[Math.floor(Math.random() * 13)]; }
    function fmt(n) { return Math.round(n).toLocaleString(); }

    // Get cell height from reel
    function getCellH() {
      const reel = document.querySelector('.reel');
      return reel.getBoundingClientRect().height / 3;
    }

    function buildStrip(col, finalCells) { buildStripN(col, finalCells, REEL_SYMBOLS); }

    function animateSpin(board, fgBonusSymbols, onSidesStop) {
      return new Promise(resolve => {
        spinning = true;
        const cellH = getCellH();
        if (turbo) {
          for (let col = 0; col < 3; col++) {
            const strip = document.querySelector(`#reel-${col} .reel-strip`);
            strip.innerHTML = '';
            strip.style.transition = 'none';
            strip.style.transform = 'translateY(0px)';
            for (let r = 0; r < 3; r++) {
              const div = document.createElement('div');
              div.className = 'cell';
              div.style.height = cellH + 'px';
              div.id = `cell-${r}-${col}`;
              div.innerHTML = `<img src="assets/img/${cellImg(board[r][col])}">`;
              if (fgBonusSymbols && col === 1 && fgBonusSymbols[r] !== '—') {
                div.innerHTML += `<span class="cell-bonus">💰${fgBonusSymbols[r].slice(1)}</span>`;
              }
              strip.appendChild(div);
            }
          }
          spinning = false;
          if (onSidesStop) onSidesStop();
          resolve();
          return;
        }
        const overshoot = Math.round(cellH * 0.05);

        // Build side reels (col 0, 2) normally
        for (let col of [0, 2]) {
          buildStripN(col, [board[0][col], board[1][col], board[2][col]], REEL_SYMBOLS);
        }

        // Middle column: 3 independent cycling mini-strips
        const midReel = document.querySelector('#reel-1 .reel-strip');
        midReel.innerHTML = '';
        midReel.style.transition = 'none';
        midReel.style.transform = 'none';
        midReel.style.display = 'flex';
        midReel.style.flexDirection = 'column';
        const midCellAnims = [];
        for (let r = 0; r < 3; r++) {
          const wrapper = document.createElement('div');
          wrapper.style.cssText = `height:${cellH}px;overflow:hidden;position:relative;`;
          const miniStrip = document.createElement('div');
          miniStrip.style.cssText = 'position:absolute;top:0;left:0;right:0;will-change:transform;';
          const numSym = 6;
          for (let i = 0; i < numSym * 2; i++) { // double for seamless loop
            const s = document.createElement('div');
            s.style.cssText = `height:${cellH}px;display:flex;align-items:center;justify-content:center;`;
            s.innerHTML = `<img src="assets/img/${randomImg()}" style="width:85%;height:85%;object-fit:contain;">`;
            miniStrip.appendChild(s);
          }
          wrapper.appendChild(miniStrip);
          midReel.appendChild(wrapper);
          // Start looping animation (varying speed per row)
          const speed = 80 + r * 15; // ms per cell, slightly different
          const loopDist = numSym * cellH;
          let pos = 0;
          const anim = { id: null, running: true };
          function loop() {
            if (!anim.running) return;
            pos -= speed * 0.06;
            if (pos <= -loopDist) pos += loopDist;
            miniStrip.style.transform = `translateY(${pos}px)`;
            anim.id = requestAnimationFrame(loop);
          }
          anim.id = requestAnimationFrame(loop);
          midCellAnims.push({ wrapper, miniStrip, anim, row: r });
        }

        // Store mid cell anims globally so JP logic can stop them
        window._midCellAnims = midCellAnims;
        window._midBoard = board;
        window._midCellH = cellH;
        window._midFgBonus = fgBonusSymbols;

        // Animate side reels
        const sideScrollDist = REEL_SYMBOLS * cellH;
        const sideFastDur = 700;
        const highSpeed = sideScrollDist / sideFastDur;
        const sideCfg = { scrollDist: sideScrollDist, decelDist: 9 * cellH, decelMs: 1350, ease: 'cubic-bezier(0.22, 1, 0.36, 1)' };
        let sidesCount = 0;

        for (let col of [0, 2]) {
          const strip = document.querySelector(`#reel-${col} .reel-strip`);
          const targetY = sideCfg.scrollDist;
          const fastDist = targetY - sideCfg.decelDist;
          const fastDur = Math.round(fastDist / highSpeed);
          strip.style.transition = `transform ${fastDur}ms linear`;
          strip.style.transform = `translateY(-${fastDist}px)`;
          setTimeout(() => {
            strip.style.transition = `transform ${sideCfg.decelMs}ms ${sideCfg.ease}`;
            strip.style.transform = `translateY(-${targetY + overshoot}px)`;
            setTimeout(() => {
              strip.style.transition = 'transform 90ms cubic-bezier(0.33, 1, 0.68, 1)';
              strip.style.transform = `translateY(-${targetY}px)`;
              setTimeout(() => {
                sidesCount++;
                if (sidesCount === 2) {
                  if (onSidesStop) onSidesStop();
                  // After sides stop, wait then stop mid cells
                  setTimeout(() => stopMidCells(resolve), 1200);
                }
              }, 100);
            }, sideCfg.decelMs);
          }, fastDur);
        }

        function stopMidCells(done) {
          const anims = window._midCellAnims;
          const bd = window._midBoard;
          const ch = window._midCellH;
          const fgB = window._midFgBonus;
          let stopped = 0;
          anims.forEach((a, i) => {
            setTimeout(() => {
              a.anim.running = false;
              cancelAnimationFrame(a.anim.id);
              // Snap to final symbol
              const finalCell = bd[a.row][1];
              let html = `<img src="assets/img/${cellImg(finalCell)}" style="width:85%;height:85%;object-fit:contain;">`;
              if (fgB && fgB[a.row] !== '—') html += `<span class="cell-bonus">💰${fgB[a.row].slice(1)}</span>`;
              a.wrapper.innerHTML = '';
              const div = document.createElement('div');
              div.className = 'cell';
              div.style.height = ch + 'px';
              div.id = `cell-${a.row}-1`;
              div.innerHTML = html;
              a.wrapper.appendChild(div);
              stopped++;
              if (stopped === 3) { spinning = false; done(); }
            }, i * 200);
          });
        }
      });
    }

    function buildFgReelStripAnim(bonusSymbols, numSym, cellH) {
      fgStripEl.innerHTML = '';
      fgStripEl.style.transition = 'none';
      fgStripEl.style.transform = 'translateY(0px)';
      for (let i = 0; i < numSym; i++) {
        const div = document.createElement('div');
        div.className = 'fg-reel-cell';
        div.style.height = cellH + 'px';
        div.textContent = FG_SYMS[Math.floor(Math.random() * FG_SYMS.length)];
        fgStripEl.appendChild(div);
      }
      for (let r = 0; r < 3; r++) {
        const div = document.createElement('div');
        div.className = 'fg-reel-cell';
        div.style.height = cellH + 'px';
        div.textContent = bonusSymbols[r];
        fgStripEl.appendChild(div);
      }
    }

    function buildFgReelStrip(bonusSymbols) {
      const cellH = Math.round(fgReelEl.clientHeight / 3);
      fgStripEl.innerHTML = '';
      fgStripEl.style.transition = 'none';
      fgStripEl.style.transform = 'translateY(0px)';
      for (let r = 0; r < 3; r++) {
        const div = document.createElement('div');
        div.className = 'fg-reel-cell';
        div.style.height = cellH + 'px';
        div.textContent = bonusSymbols[r];
        fgStripEl.appendChild(div);
      }
    }

    function buildStripN(col, finalCells, numSym, bonusSymbols) {
      const strip = document.querySelector(`#reel-${col} .reel-strip`);
      const cellH = getCellH();
      strip.innerHTML = '';
      strip.style.transition = 'none';
      strip.style.transform = 'translateY(0px)';
      for (let i = 0; i < numSym; i++) {
        const div = document.createElement('div');
        div.className = 'cell';
        div.style.height = cellH + 'px';
        div.innerHTML = `<img src="assets/img/${randomImg()}">`;
        if (bonusSymbols) {
          const rSym = FG_SYMS[Math.floor(Math.random() * FG_SYMS.length)];
          if (rSym !== '—') div.innerHTML += `<span class="cell-bonus">💰${rSym.slice(1)}</span>`;
        }
        strip.appendChild(div);
      }
      for (let r = 0; r < 3; r++) {
        const div = document.createElement('div');
        div.className = 'cell';
        div.style.height = cellH + 'px';
        div.id = `cell-${r}-${col}`;
        div.innerHTML = `<img src="assets/img/${cellImg(finalCells[r])}">`;
        if (bonusSymbols && bonusSymbols[r] !== '—') {
          div.innerHTML += `<span class="cell-bonus">💰${bonusSymbols[r].slice(1)}</span>`;
        }
        strip.appendChild(div);
      }
    }

    // Animate middle column cells individually for JP (top→mid→bottom, each with mini strip)
    function animateJpCells(finalSyms, pool) {
      const cellH = getCellH();
      return new Promise(resolve => {
        let done = 0;
        for (let r = 0; r < 3; r++) {
          const cell = document.getElementById(`cell-${r}-1`);
          if (!cell) { done++; if (done === 3) resolve(); continue; }
          // Build mini strip inside cell
          const numSym = 8;
          cell.style.overflow = 'hidden';
          const miniStrip = document.createElement('div');
          miniStrip.style.cssText = 'display:flex;flex-direction:column;position:absolute;top:0;left:0;right:0;will-change:transform;';
          for (let i = 0; i < numSym; i++) {
            const s = document.createElement('div');
            s.style.cssText = `height:${cellH}px;display:flex;align-items:center;justify-content:center;`;
            const sym = pickJpSymbol(pool);
            const img = getJpImg(sym);
            s.innerHTML = img ? `<img src="${img}" style="width:85%;height:85%;object-fit:contain;">` : `<img src="assets/img/${randomImg()}" style="width:85%;height:85%;object-fit:contain;">`;
            miniStrip.appendChild(s);
          }
          // Final cell
          const finalDiv = document.createElement('div');
          finalDiv.style.cssText = `height:${cellH}px;display:flex;align-items:center;justify-content:center;`;
          const fImg = getJpImg(finalSyms[r]);
          finalDiv.innerHTML = fImg ? `<img src="${fImg}" style="width:85%;height:85%;object-fit:contain;">` : `<img src="assets/img/${randomImg()}" style="width:85%;height:85%;object-fit:contain;">`;
          miniStrip.appendChild(finalDiv);

          cell.innerHTML = '';
          cell.appendChild(miniStrip);
          const totalDist = numSym * cellH;
          const delay = r * 250; // stagger: 0, 250, 500ms
          setTimeout(() => {
            miniStrip.style.transition = 'transform 400ms linear';
            miniStrip.style.transform = `translateY(-${totalDist * 0.4}px)`;
            setTimeout(() => {
              miniStrip.style.transition = 'transform 600ms cubic-bezier(0.16, 1, 0.3, 1)';
              miniStrip.style.transform = `translateY(-${totalDist}px)`;
              setTimeout(() => {
                // Snap to final
                cell.innerHTML = fImg ? `<img src="${fImg}" style="width:85%;height:85%;object-fit:contain;">` : `<img src="assets/img/${randomImg()}" style="width:85%;height:85%;object-fit:contain;">`;
                done++;
                if (done === 3) resolve();
              }, 600);
            }, 400);
          }, delay);
        }
      });
    }

    const FG_SYMS = ['+5','+10','+15','+30','+50','—'];

    // JP Slot system — extreme narrow gate triggers JP symbols in middle reel
    const JP_NARROW_POOL = ['GRAND','MAJOR','MINI','normal','normal','normal']; // gap=1
    const JP_MID_POOL = ['MAJOR','MINI','normal','normal','normal','normal'];   // gap≤3
    function getJpPool(gap) {
      if (gap === 1) return JP_NARROW_POOL;
      if (gap <= 3) return JP_MID_POOL;
      return null;
    }
    function pickJpSymbol(pool) { return pool[Math.floor(Math.random() * pool.length)]; }
    function checkJpSlotWin(symbols) {
      if (symbols[0] !== 'normal' && symbols[0] === symbols[1] && symbols[1] === symbols[2]) return symbols[0];
      return null;
    }
    function getJpImg(sym) {
      if (sym === 'GRAND') return 'assets/img/GRAND.png';
      if (sym === 'MAJOR') return 'assets/img/MAJOR.png';
      if (sym === 'MINI') return 'assets/img/MINI.png';
      return null;
    }

    function flyFgCoins(judgments, bonusSymbols) {
      const flyers = [];
      for (const j of judgments) {
        if (j.type !== 'through' || bonusSymbols[j.row] === '—') continue;
        const cell = document.getElementById(`cell-${j.row}-1`);
        const badge = $(`badge-${j.row}`);
        const src = cell && cell.querySelector('.cell-bonus');
        if (!src || !badge) continue;
        const srcRect = src.getBoundingClientRect();
        const dstRect = badge.getBoundingClientRect();
        const flyer = document.createElement('span');
        flyer.textContent = `💰${bonusSymbols[j.row].slice(1)}`;
        flyer.style.cssText = `position:fixed;left:${srcRect.left}px;top:${srcRect.top}px;z-index:9999;font-size:13px;color:#ffd700;font-weight:bold;background:rgba(0,0,0,0.7);border-radius:8px;padding:2px 6px;transition:all 600ms cubic-bezier(0.25,1,0.5,1);pointer-events:none;`;
        document.body.appendChild(flyer);
        flyers.push({ clone: flyer, dstRect, badge, sym: bonusSymbols[j.row] });
        requestAnimationFrame(() => {
          flyer.style.left = `${dstRect.left + dstRect.width/2 - 20}px`;
          flyer.style.top = `${dstRect.top + dstRect.height/2 - 10}px`;
          flyer.style.transform = 'scale(1.3)';
          flyer.style.opacity = '0.8';
        });
      }
      if (flyers.length === 0) return Promise.resolve();
      return new Promise(resolve => {
        setTimeout(() => {
          for (const f of flyers) {
            f.clone.remove();
            f.badge.textContent = `💰${f.sym.slice(1)}`;
            f.badge.className = `badge badge-${f.badge.id.slice(-1)} win`;
          }
          resolve();
        }, 650);
      });
    }

    function bgBuildChips() {
      const container = $('bg-chip-btns');
      container.innerHTML = '';
      const chips = [
        { pct: 10, x: 76, y: 616 },
        { pct: 20, x: 127, y: 616 },
        { pct: 100, x: 178, y: 616 },
        { pct: 30, x: 229, y: 616 },

      chips.forEach(c => {
        const amt = Math.round(bgInstance.chips * c.pct / 100);
        const btn = document.createElement('button');
        btn.className = 'bg-chip-btn';
        btn.textContent = `${c.pct}%\n${fmt(amt)}`;
        btn.style.whiteSpace = 'pre-line';
        btn.style.left = (c.x / 390 * 100) + '%';
        btn.style.top = (c.y / 844 * 100) + '%';
        btn.disabled = amt <= 0;
        btn.addEventListener('click', () => {
          container.querySelectorAll('.bg-chip-btn').forEach(b => b.classList.remove('selected'));

    function bgDeal() {
      if (!bgInstance || !bgInstance.active) return;
      if (bgRoundTimer) clearInterval(bgRoundTimer);
      $('bg-deal-btn').disabled = true;
      $('bg-chip-btns').querySelectorAll('.bg-chip-btn').forEach(b => { b.disabled = true; });
      // Flip animation
      const midCard = $('bg-card-m');
      midCard.classList.add('flip');
      setTimeout(() => {
        if (!bgInstance) return; // guard against race with bgEnd
        const result = bgInstance.reveal();
        midCard.innerHTML = `<img src="assets/img/${CARD_IMG[result.mid]}">`;
        midCard.className = 'bg-card face';
        bgInstance.applyResult(result);
        // Show result
        const resEl = $('bg-result-text');
        if (result.mult > 0) {
          resEl.textContent = `穿門！×${result.mult} +${fmt(bgInstance.roundBet * result.mult)}`;
          resEl.className = 'bg-result-text win';
          sfx('gate_through');
        } else if (result.type === 'wall') {
          resEl.textContent = `碰壁！-${fmt(Math.abs(bgInstance.roundBet * result.mult))}`;
          resEl.className = 'bg-result-text lose';
          sfx('wall_hit');
        } else if (result.type === 'same-hit') {
          resEl.textContent = `同值撞柱！-${fmt(Math.abs(bgInstance.roundBet * result.mult))}`;
          resEl.className = 'bg-result-text lose';
          sfx('wall_hit');
        } else {
          resEl.textContent = `未穿 -${fmt(Math.abs(bgInstance.roundBet * result.mult))}`;
          resEl.className = 'bg-result-text lose';
        }
        bgUpdateUI();
        // Next round after delay
        setTimeout(() => {
          if (!bgInstance) return;
          if (bgInstance.active && bgInstance.chips > 0) bgNewRound();
          else {
            if (bgInstance.chips <= 0) {
              $('bg-result-text').textContent = '💸 籌碼用盡！';
              $('bg-result-text').className = 'bg-result-text lose';
              setTimeout(() => bgEnd(), 1500);
            } else bgEnd();
          }
        }, 2000);
      }, 750); // halfway through flip
    }

    async function doSpin() {
      if (spinning || !gm.canSpin()) return;
      for (let r = 0; r < 3; r++) { $(`badge-${r}`).textContent = ''; $(`badge-${r}`).className = 'badge badge-' + r; }
      const isFG = gm.fg.active;
      sfx('spin_charge');
      updateUI();
      const result = gm.executeSpin();
      if (!result) return;
      if (result.mode === 'fg') {
        await animateSpin(result.board, result.bonusSymbols);
        sfx('spin_release');
        // Win lines for rows that scored
        const winRows = result.judgments
          .filter(j => j.type === 'through' && result.bonusSymbols[j.row] !== '—')
          .map(j => ({ row: j.row, badgeEl: $(`badge-${j.row}`) }));
        if (winRows.length > 0) await playWinLines(winRows);
        // Fly coin from mid-column to badge
        await flyFgCoins(result.judgments, result.bonusSymbols);
        $('win').textContent = fmt(result.totalScore);
        updateUI();
        if (result.fgDone) { showFGResult(result.totalScore); }
        else { setTimeout(() => doSpin(), 400); }
        return result;
      }
      // Normal mode: determine JP symbols, pass onSidesStop callback
      let jpSlotWin = null;
      let jpSyms = null;
      if (window._debugJpNext) {
        jpSyms = [window._debugJpNext, window._debugJpNext, window._debugJpNext];
        window._debugJpNext = null;
      }
      await animateSpin(result.board, null, () => {
        // Sides stopped — flash middle reel if narrow gate detected
        if (!jpSyms) {
          const jpRow = result.judgments.find(j => j.type !== 'scatter' && j.type !== 'same-hit' && j.type !== 'same-miss' && j.gap >= 1 && j.gap <= 3);
          if (jpRow) {
            console.log('[JP] Triggered:', result.judgments.map(j => `row${j.row} type=${j.type} gap=${j.gap}`).join(', '));
            const pool = getJpPool(jpRow.gap);
            jpSyms = [pickJpSymbol(pool), pickJpSymbol(pool), pickJpSymbol(pool)];
          }
        }
        if (jpSyms) {
          const midReel = document.getElementById('reel-1');
          midReel.style.boxShadow = '0 0 16px 4px rgba(255,215,0,0.7)';
        }
      });
      sfx('spin_release');
      // After all reels stop: if JP symbols, do independent cell animation
      if (jpSyms) {
        await animateJpCells(jpSyms, jpSyms.some(s => s !== 'normal') ? getJpPool(1) : getJpPool(2));
        const midReel = document.getElementById('reel-1');
        setTimeout(() => { midReel.style.boxShadow = ''; }, 800);
        jpSlotWin = checkJpSlotWin(jpSyms);
      }
      showResult(result);
      // Play result sfx + win line effect
      if (result.mode === 'normal') {
        // Scatter first (top-to-bottom, left-to-right), with fly to collector
        if (result.scatterCount > 0) await revealScatters(result.board, result.scatterCount);
        // Wall hits — await each so the effect is visible
        for (const j of result.judgments) {
          if (j.type === 'wall' || j.type === 'same-hit') await playWallHit(j.row);
        }
        for (const j of result.judgments) {
          if (j.type === 'through') sfx('gate_through');
        }
        if (result.totalPayout > 0) sfx('coin_count');
        if (result.fgTriggered) sfx('gate_open');
        const winRows = result.judgments
          .filter(j => j.type === 'through')
          .map(j => ({ row: j.row, badgeEl: $(`badge-${j.row}`) }));
        if (winRows.length > 0) await playWinLines(winRows);
        // JP Slot win
        if (jpSlotWin) {
          const jpAmount = jpSlotWin === 'GRAND' ? jpGrand : jpSlotWin === 'MAJOR' ? jpMajor : jpMini;
          gm.balance += jpAmount;
          if (jpSlotWin === 'GRAND') jpGrand = 30000;
          else if (jpSlotWin === 'MAJOR') jpMajor = 6000;
          else jpMini = 1500;
          showFGResult(jpAmount);
        }
      }
      updateUI();
      if (result.fgTriggered || (result.mode === 'fg' && gm.fg.active)) {
        if (result.fgTriggered) { showFgBgChoice(); }
        else { setTimeout(() => doSpin(), 400); }
      }
      return result;
    }

    function showResult(result) {
      for (let r = 0; r < 3; r++) { $(`badge-${r}`).textContent = ''; $(`badge-${r}`).className = 'badge badge-' + r; }
      if (result.mode === 'fg') { return; }
      result.judgments.forEach(j => {
        const badge = $(`badge-${j.row}`);
        const rowScatters = [result.board[j.row][0], result.board[j.row][1], result.board[j.row][2]].filter(c => c.isScatter).length;
        if (rowScatters > 0) { badge.textContent = `🐉 +${rowScatters}`; badge.classList.add('sc'); }
        else if (j.type === 'through') { badge.textContent = '穿門\n+' + fmt(Math.round(gm.bet/3*j.mult)); badge.classList.add('win'); }
        else if (j.type === 'wall') { badge.textContent = '🔥 -1'; badge.classList.add('wall'); }
        else if (j.type === 'same-hit') { badge.textContent = '🔥 -2'; badge.classList.add('wall'); }
        else { badge.textContent = '—'; }
      });
      const winEl = $('win');
      if (result.totalPayout > 0) { winEl.textContent = fmt(result.totalPayout); winEl.style.color = '#ffd700'; }
      else { winEl.textContent = '0'; winEl.style.color = '#ffd700'; }
      $('results').textContent = result.fgTriggered ? '🎰 Free Game!' : '';
      updateRing(gm.scatterLamps);
    }

    // Rules overlay
    const RULES_PAGES = [
      `<h3>🎰 遊戲玩法</h3><p>射龍門 Slot，3×3 盤面。</p><p>左右欄決定「門寬」，中欄判定穿門。</p><ul><li>穿門成功 → 依門寬賠率派彩</li><li>碰壁 → 不扣錢，扣 1 個 Scatter 燈</li><li>同值撞柱 → 不扣錢，扣 2 個 Scatter 燈</li></ul>`,
      `<h3>💰 計分規則</h3><p>穿門賠率（依門寬）：</p><ul><li>極窄（差2）：×15</li><li>窄（差3~4）：×6</li><li>中（差5~8）：×3</li><li>寬（差9~11）：×1</li></ul><p>每次 Spin 扣 bet（bet 平均分配給三列）</p><p>🐉 Scatter 龍符號：累積燈號 +1</p>`,
      `<h3>🐲 Free Game</h3><ul><li>Scatter 累積燈號達 10 個觸發</li><li>碰壁扣 1 燈、同值扣 2 燈（會延遲觸發）</li><li>Free Game 中不出 Scatter、不碰壁</li><li>穿門成功直接獲得彩金</li><li>觸發後燈號歸零重新收集</li></ul>`
    ];
    function showRulesPage(page) {
      $('rules-content').innerHTML = RULES_PAGES[page];
      document.querySelectorAll('.rules-tab').forEach(t => t.classList.toggle('active', +t.dataset.page === page));
    }
    $('rules-btn').addEventListener('click', () => { $('rules-overlay').style.display = 'flex'; showRulesPage(0); });
    $('rules-close').addEventListener('click', () => { $('rules-overlay').style.display = 'none'; });
    $('rules-overlay').addEventListener('click', e => { if (e.target === $('rules-overlay')) $('rules-overlay').style.display = 'none'; });
    document.querySelectorAll('.rules-tab').forEach(t => t.addEventListener('click', () => showRulesPage(+t.dataset.page)));
    $('vol-btn').addEventListener('click', () => {
      muted = !muted;
      $('vol-btn').classList.toggle('muted', muted);
      $('vol-btn').innerHTML = muted
        ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>'
        : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.08"/></svg>';
      bgm.volume = muted ? 0 : 0.3;
    });
    $('turbo-btn').addEventListener('click', () => {
      turbo = !turbo;
      $('turbo-btn').classList.toggle('active', turbo);
      $('turbo-btn').style.background = turbo ? 'rgba(255,215,0,0.25)' : '';
    });
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && !e.repeat) { e.preventDefault(); doSpin(); }
      if (e.key === 'f' && !gm.fg.active && !spinning) { showFgBgChoice(); }
      let debugJpNext = null; // 'GRAND'|'MAJOR'|'MINI'
      if (e.key === 'j' || e.key === 'J') { debugJpNext = 'GRAND'; }
      if (e.key === 'm' || e.key === 'M') { debugJpNext = 'MAJOR'; }
      if (e.key === 'n' || e.key === 'N') { debugJpNext = 'MINI'; }
      if (debugJpNext) window._debugJpNext = debugJpNext;
    });
    $('fgbg-close').addEventListener('click', () => { $('fgbg-choice').style.display = 'none'; });

    // JP Pool auto-climb — independent timers per tier
    let jpGrand = 30000, jpMajor = 6000, jpMini = 1500;
    function animateJp(el, start, end, duration) {
      const range = end - start;
      const t0 = performance.now();
      function step(now) {
        const t = Math.min((now - t0) / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        el.textContent = Math.round(start + range * ease).toLocaleString();
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    const grandEl = $('jp-grand-val'), majorEl = $('jp-major-val'), miniEl = $('jp-mini-val');
    grandEl.textContent = jpGrand.toLocaleString();
    majorEl.textContent = jpMajor.toLocaleString();
    miniEl.textContent = jpMini.toLocaleString();
    (function tickMini() {
      setTimeout(() => {
        const prev = jpMini;
        jpMini += Math.ceil(Math.random() * 5);
        if (jpMini >= jpMajor) jpMini = 1500;
        animateJp(miniEl, prev, jpMini, 800);
        tickMini();
      }, 2000 + Math.random() * 2000);
    })();
    (function tickMajor() {
      setTimeout(() => {
        const prev = jpMajor;
        jpMajor += 3 + Math.floor(Math.random() * 6);
        if (jpMajor >= jpGrand) jpMajor = 6000;
        animateJp(majorEl, prev, jpMajor, 800);
        tickMajor();
      }, 5000 + Math.random() * 5000);
    })();
    (function tickGrand() {
      setTimeout(() => {
        const prev = jpGrand;
        jpGrand += 5 + Math.floor(Math.random() * 11);
        animateJp(grandEl, prev, jpGrand, 800);
        tickGrand();
      }, 10000 + Math.random() * 10000);
    })();

    window.focus();
  </script>
</body>
</html>
