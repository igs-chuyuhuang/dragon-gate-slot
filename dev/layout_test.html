<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>射龍門 — Layout Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      width: 100vw; height: 100dvh;
      overflow: hidden;
      display: flex; justify-content: center; align-items: flex-start;
    }
    .game-root {
      width: 100vw;
      height: 100dvh;
      max-width: calc(100dvh * 9 / 16);
      position: relative;
      overflow: hidden;
    }
    .bg-layer {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .frame-layer {
      position: absolute;
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="game-root">
    <img class="bg-layer" src="assets/img/BG-01_main_bg_mobile.png" alt="BG">
    <img class="frame-layer" src="assets/img/FR-01_slot_frame_mobile.png" alt="Frame">
  </div>
</body>
</html>
