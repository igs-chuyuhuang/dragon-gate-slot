<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>射龍門 — Layout Test v2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      width: 100vw; height: 100dvh;
      overflow: hidden;
      display: flex; justify-content: center; align-items: flex-start;
    }
    .game-root {
      width: 100vw;
      height: 100dvh;
      max-width: calc(100dvh * 9 / 16);
      position: relative;
      overflow: hidden;
    }
    .bg-layer {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    /* 3x3 Grid - positioned on BG's black cells */
    .cell {
      position: absolute;
      z-index: 3;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .cell img {
      width: 88%; height: 88%;
      object-fit: contain;
    }
    /* Row 1 */
    .cell-0-0 { left: 17.2%; top: 34.0%; width: 17.5%; height: 12.0%; }
    .cell-0-1 { left: 36.3%; top: 34.0%; width: 17.7%; height: 12.0%; }
    .cell-0-2 { left: 55.6%; top: 34.0%; width: 17.5%; height: 12.0%; }
    /* Row 2 */
    .cell-1-0 { left: 17.2%; top: 46.7%; width: 17.5%; height: 11.8%; }
    .cell-1-1 { left: 36.3%; top: 46.7%; width: 17.7%; height: 11.8%; }
    .cell-1-2 { left: 55.6%; top: 46.7%; width: 17.5%; height: 11.8%; }
    /* Row 3 */
    .cell-2-0 { left: 17.2%; top: 59.2%; width: 17.5%; height: 12.0%; }
    .cell-2-1 { left: 36.3%; top: 59.2%; width: 17.7%; height: 12.0%; }
    .cell-2-2 { left: 55.6%; top: 59.2%; width: 17.5%; height: 12.0%; }

    /* Right side badges */
    .badge {
      position: absolute;
      z-index: 4;
      display: flex; align-items: center; justify-content: center;
      color: #ffd700; font-weight: bold;
      font-size: clamp(10px, 2.5vw, 16px);
      text-align: center;
    }
    .badge-0 { left: 77.6%; top: 35.4%; width: 14.4%; height: 10.1%; }
    .badge-1 { left: 77.6%; top: 48.3%; width: 14.4%; height: 9.9%; }
    .badge-2 { left: 77.6%; top: 61.0%; width: 14.4%; height: 9.7%; }
  </style>
</head>
<body>
  <div class="game-root">
    <img class="bg-layer" src="assets/img/BG.png" alt="BG">

    <!-- 3x3 Symbols -->
    <div class="cell cell-0-0"><img src="assets/img/CD-01_ace.png"></div>
    <div class="cell cell-0-1"><img src="assets/img/CD-02_king.png"></div>
    <div class="cell cell-0-2"><img src="assets/img/CD-03_queen.png"></div>
    <div class="cell cell-1-0"><img src="assets/img/CD-04_jack.png"></div>
    <div class="cell cell-1-1"><img src="assets/img/SC-01_scatter_dragon.png"></div>
    <div class="cell cell-1-2"><img src="assets/img/CD-13_num10.png"></div>
    <div class="cell cell-2-0"><img src="assets/img/CD-12_num9.png"></div>
    <div class="cell cell-2-1"><img src="assets/img/CD-03_queen.png"></div>
    <div class="cell cell-2-2"><img src="assets/img/CD-02_king.png"></div>

    <!-- Right badges -->
    <div class="badge badge-0">🐉 ×1</div>
    <div class="badge badge-1">穿門<br>+13</div>
    <div class="badge badge-2">🐉 ×1</div>
  </div>
</body>
</html>
