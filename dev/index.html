<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>射龍門 Slot</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div class="game-root">
    <img class="bg-layer" src="assets/img/BG.png" alt="">

    <!-- 3 Reel containers (absolute positioned on BG grid) -->
    <div class="reel" id="reel-0"><div class="reel-strip"></div></div>
    <div class="reel" id="reel-1"><div class="reel-strip"></div></div>
    <div class="reel" id="reel-2"><div class="reel-strip"></div></div>

    <!-- Badges -->
    <div class="badge badge-0" id="badge-0"></div>
    <div class="badge badge-1" id="badge-1"></div>
    <div class="badge badge-2" id="badge-2"></div>

    <!-- Bottom UI -->
    <div class="ui-balance"><span class="ui-label">餘額</span><span class="ui-val" id="balance">1,000</span></div>
    <div class="ui-bet">
      <button class="ui-btn-adj" id="bet-dec">−</button>
      <div><span class="ui-label">押注</span><span class="ui-val" id="bet">10</span></div>
      <button class="ui-btn-adj" id="bet-inc">+</button>
    </div>
    <div class="ui-win"><span class="ui-label">贏分</span><span class="ui-val" id="win">0</span></div>

    <!-- SPIN -->
    <button class="spin-btn" id="spin-btn">SPIN</button>

    <!-- Func -->
    <button class="func-btn func-auto" id="auto-btn">Auto</button>
    <button class="func-btn func-info" id="rules-btn">i</button>

    <!-- FG info -->
    <div class="fg-info" id="fg-info" style="display:none"></div>
    <div class="results-bar" id="results"></div>

    <!-- JP hidden -->
    <span id="jp-basic" style="display:none">500</span>
    <span id="jp-major" style="display:none">2000</span>
    <span id="jp-grand" style="display:none">10000</span>
  </div>

  <!-- Auto Panel -->
  <div class="auto-overlay" id="auto-overlay" style="display:none">
    <div class="auto-panel">
      <div class="auto-stepper">
        <button class="ui-btn-adj" id="auto-dec">−</button>
        <span id="auto-count-display">50 局</span>
        <button class="ui-btn-adj" id="auto-inc">+</button>
      </div>
      <div class="auto-actions">
        <button class="auto-start" id="auto-start">開始</button>
        <button class="auto-cancel" id="auto-cancel">取消</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { spin, countScatters } from './js/slotEngine.js';
    import { GameManager } from './js/gameManager.js';

    const gm = new GameManager();
    const $ = id => document.getElementById(id);
    let spinning = false;
    let autoSpins = 0, autoStopped = false, autoCount = 50;

    const CARD_IMG = {
      1:'CD-01_ace.png',2:'CD-05_num2.png',3:'CD-06_num3.png',
      4:'CD-07_num4.png',5:'CD-08_num5.png',6:'CD-09_num6.png',
      7:'CD-10_num7.png',8:'CD-11_num8.png',9:'CD-12_num9.png',
      10:'CD-13_num10.png',11:'CD-04_jack.png',12:'CD-03_queen.png',13:'CD-02_king.png'
    };
    const SC_IMG = 'SC-01_scatter_dragon.png';
    const ALL_IMGS = Object.values(CARD_IMG);
    const REEL_SYMBOLS = 30;

    function cellImg(cell) { return cell.isScatter ? SC_IMG : CARD_IMG[cell.value]; }
    function randomImg() { return ALL_IMGS[Math.floor(Math.random() * 13)]; }
    function fmt(n) { return Math.round(n).toLocaleString(); }

    // Get cell height from reel
    function getCellH() {
      const reel = document.querySelector('.reel');
      return reel.getBoundingClientRect().height / 3;
    }

    function buildStrip(col, finalCells) {
      const strip = document.querySelector(`#reel-${col} .reel-strip`);
      const cellH = getCellH();
      strip.innerHTML = '';
      strip.style.transform = 'translateY(0px)';
      for (let i = 0; i < REEL_SYMBOLS; i++) {
        const div = document.createElement('div');
        div.className = 'cell';
        div.style.height = cellH + 'px';
        div.innerHTML = `<img src="assets/img/${randomImg()}">`;
        strip.appendChild(div);
      }
      for (let r = 0; r < 3; r++) {
        const div = document.createElement('div');
        div.className = 'cell';
        div.style.height = cellH + 'px';
        div.id = `cell-${r}-${col}`;
        div.innerHTML = `<img src="assets/img/${cellImg(finalCells[r])}">`;
        strip.appendChild(div);
      }
      return strip;
    }

    function animateSpin(board) {
      return new Promise(resolve => {
        spinning = true;
        const cellH = getCellH();
        const scrollDist = REEL_SYMBOLS * cellH;

        for (let col = 0; col < 3; col++) {
          const finalCells = [board[0][col], board[1][col], board[2][col]];
          buildStrip(col, finalCells);
        }

        // Animate each column: left(0ms) → right(300ms) → middle(700ms)
        const colOrder = [0, 2, 1];
        const delays = [0, 300, 700];
        let done = 0;

        colOrder.forEach((col, idx) => {
          const strip = document.querySelector(`#reel-${col} .reel-strip`);
          const dur = 800 + delays[idx];

          // Fast scroll
          setTimeout(() => {
            strip.style.transition = `transform ${dur}ms cubic-bezier(0.2, 0, 0.1, 1)`;
            strip.style.transform = `translateY(-${scrollDist}px)`;

            strip.addEventListener('transitionend', function handler() {
              strip.removeEventListener('transitionend', handler);
              strip.style.transition = 'none';
              done++;
              if (done === 3) { spinning = false; resolve(); }
            });
          }, delays[idx]);
        });
      });
    }

    function updateUI() {
      $('balance').textContent = fmt(gm.balance);
      $('bet').textContent = fmt(gm.bet);
      $('spin-btn').disabled = spinning || !gm.canSpin();
      $('bet-dec').disabled = spinning || gm.betIndex <= 0;
      $('bet-inc').disabled = spinning || gm.betIndex >= 4;
      $('auto-btn').textContent = autoSpins > 0 ? `Auto ${autoSpins}` : 'Auto';
      const fgEl = $('fg-info');
      if (gm.fg.active) { fgEl.style.display = 'block'; fgEl.textContent = `FG: ${gm.fg.spinsLeft}轉 | ${fmt(gm.fg.totalScore)}分`; }
      else { fgEl.style.display = 'none'; }
    }

    async function doSpin() {
      if (spinning || !gm.canSpin()) return;
      updateUI();
      const result = gm.executeSpin();
      if (!result) return;
      await animateSpin(result.board);
      showResult(result);
      updateUI();
      if (result.fgTriggered || (result.mode === 'fg' && gm.fg.active)) {
        setTimeout(() => doSpin(), 400);
      }
      return result;
    }

    function showResult(result) {
      for (let r = 0; r < 3; r++) { $(`badge-${r}`).textContent = ''; $(`badge-${r}`).className = 'badge badge-' + r; }
      if (result.mode === 'fg') {
        $('results').textContent = `FG +${fmt(result.spinScore)} | 累積 ${fmt(result.totalScore)}`;
        if (result.fgDone && result.jpResult) $('win').textContent = '+' + fmt(result.jpResult.payout);
        return;
      }
      result.judgments.forEach(j => {
        const badge = $(`badge-${j.row}`);
        const hasSC = [result.board[j.row][0], result.board[j.row][1], result.board[j.row][2]].some(c => c.isScatter);
        if (hasSC) { badge.textContent = '🐉 ×1'; badge.classList.add('sc'); }
        else if (j.type === 'through') { badge.textContent = '穿門\n+' + fmt(Math.round(gm.bet/3*j.mult)); badge.classList.add('win'); }
        else if (j.type === 'wall') { badge.textContent = '碰壁\n+' + fmt(Math.round(gm.bet/3*1.2)); badge.classList.add('wall'); }
        else { badge.textContent = '—'; }
      });
      const winEl = $('win');
      if (result.totalPayout > 0) { winEl.textContent = '+' + fmt(result.totalPayout); winEl.style.color = '#ffd700'; }
      else if (result.totalPayout < 0) { winEl.textContent = fmt(result.totalPayout); winEl.style.color = '#ff5555'; }
      else { winEl.textContent = '0'; winEl.style.color = '#ffd700'; }
      $('results').textContent = result.fgTriggered ? '🎰 Free Game!' : '';
    }

    // Auto
    function toggleAuto() {
      if (autoSpins > 0) { autoStopped = true; autoSpins = 0; updateUI(); return; }
      $('auto-overlay').style.display = 'flex';
    }
    async function startAuto() {
      $('auto-overlay').style.display = 'none';
      autoSpins = autoCount; autoStopped = false;
      while (autoSpins > 0 && !autoStopped && gm.canSpin()) {
        await doSpin(); autoSpins--; updateUI();
        if (autoSpins > 0 && !autoStopped) await new Promise(r => setTimeout(r, 300));
      }
      autoSpins = 0; updateUI();
    }

    // Init: show random symbols
    function initReels() {
      const cellH = getCellH();
      for (let col = 0; col < 3; col++) {
        const strip = document.querySelector(`#reel-${col} .reel-strip`);
        strip.innerHTML = '';
        for (let r = 0; r < 3; r++) {
          const div = document.createElement('div');
          div.className = 'cell';
          div.style.height = cellH + 'px';
          div.id = `cell-${r}-${col}`;
          div.innerHTML = `<img src="assets/img/${randomImg()}">`;
          strip.appendChild(div);
        }
      }
    }

    initReels();
    updateUI();
    $('spin-btn').addEventListener('click', doSpin);
    $('bet-dec').addEventListener('click', () => { if (!spinning) { gm.setBetIndex(gm.betIndex-1); updateUI(); } });
    $('bet-inc').addEventListener('click', () => { if (!spinning) { gm.setBetIndex(gm.betIndex+1); updateUI(); } });
    $('auto-btn').addEventListener('click', toggleAuto);
    $('auto-start').addEventListener('click', startAuto);
    $('auto-cancel').addEventListener('click', () => { $('auto-overlay').style.display = 'none'; });
    $('auto-dec').addEventListener('click', () => { autoCount = Math.max(10, autoCount-10); $('auto-count-display').textContent = autoCount+' 局'; });
    $('auto-inc').addEventListener('click', () => { autoCount = Math.min(100, autoCount+10); $('auto-count-display').textContent = autoCount+' 局'; });
    $('rules-btn').addEventListener('click', () => { alert('射龍門 Slot\\n\\n左右欄決定門寬，中欄穿門。\\n賠率：極窄×6/窄×4/中×2/寬×1/碰壁×1.2\\nScatter 3個觸發 Free Game (8轉)'); });
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && !e.repeat) { e.preventDefault(); doSpin(); }
      if (e.key === 'f' && !gm.fg.active && !spinning) { gm.triggerFreeGame(); updateUI(); setTimeout(doSpin, 300); }
    });
  </script>
</body>
</html>
