<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>射龍門 Slot</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div class="game-root">
    <img class="bg-layer" src="assets/img/BG.png" alt="">

    <!-- Jackpot Pool -->
    <div class="jp-pool-container">
      <img class="jp-pool" src="assets/img/JP-pool.png" alt="Jackpot Pool">
      <div class="jp-values">
        <span class="jp-val" id="jp-grand-val">3,000</span>
        <span class="jp-val" id="jp-major-val">500</span>
        <span class="jp-val" id="jp-mini-val">100</span>
      </div>
    </div>

    <!-- 3 Reel containers (absolute positioned on BG grid) -->
    <div class="reel" id="reel-0"><div class="reel-strip"></div></div>
    <div class="reel" id="reel-1"><div class="reel-strip"></div></div>
    <div class="reel" id="reel-2"><div class="reel-strip"></div></div>

    <!-- Badges -->
    <div class="badge badge-0" id="badge-0"></div>
    <div class="badge badge-1" id="badge-1"></div>
    <div class="badge badge-2" id="badge-2"></div>

    <!-- FG Bonus Reel -->
    <div class="fg-reel" id="fg-reel" style="display:none">
      <div class="fg-reel-strip" id="fg-reel-strip"></div>
    </div>

    <img class="mascot-dragon" src="assets/img/MS-01_mascot_dragon.png" alt="mascot">

    <!-- Bottom Control Panel -->
    <div class="ctrl-panel">
      <div class="ctrl-info-cell" id="cell-balance">
        <span class="ctrl-label">餘額</span>
        <span class="ctrl-val" id="balance">1,000</span>
      </div>
      <button class="ctrl-auto-upper" id="auto-btn">自動</button>
      <button class="spin-btn" id="spin-btn">SPIN</button>
      <div class="ctrl-bet-group">
        <span class="ctrl-label">投注</span>
        <span class="ctrl-val" id="bet">10</span>
      </div>
      <button class="ctrl-adj" id="bet-dec">−</button>
      <button class="ctrl-adj" id="bet-inc">+</button>
      <div class="ctrl-info-cell" id="cell-win">
        <span class="ctrl-label">贏分</span>
        <span class="ctrl-val" id="win">0</span>
      </div>
      <div class="ctrl-action-row">
        <button class="ctrl-func" id="vol-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.08"/></svg>
        </button>
        <button class="ctrl-func" id="turbo-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </button>
        <button class="ctrl-func" id="rules-btn">i</button>
      </div>
    </div>

    <!-- FG info -->
    <div class="fg-info" id="fg-info" style="display:none"></div>
    <div class="results-bar" id="results"></div>

    <!-- FG Result Overlay -->
    <div class="fg-result-overlay" id="fg-result-overlay" style="display:none">
      <div class="fg-result-panel">
        <div class="fg-result-title">FREE GAME</div>
        <div class="fg-result-big" id="fg-result-big" style="display:none">BIG WIN!</div>
        <div class="fg-result-label">總贏分</div>
        <div class="fg-result-amount" id="fg-result-amount">0</div>
      </div>
    </div>

    <!-- Scatter Progress Ring -->
    <div class="scatter-ring" id="scatter-ring">
      <div class="ring-bg"></div>
      <svg class="ring-svg" viewBox="0 0 100 100">
        <defs>
          <filter id="glow-filter" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
            <feFlood flood-color="#00ffc8" flood-opacity="0.7" result="color"/>
            <feComposite in="color" in2="blur" operator="in" result="glow"/>
            <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g id="ring-segments"></g>
        <g id="ring-glow" filter="url(#glow-filter)"></g>
      </svg>
      <div class="ring-orb" id="ring-orb"></div>
      <img class="ring-icon" src="assets/img/SC-01_scatter_dragon.png" alt="scatter">
      <span class="ring-label" id="ring-label">0/10</span>
    </div>

    <!-- JP hidden -->
    <span id="jp-basic" style="display:none">500</span>
    <span id="jp-major" style="display:none">2000</span>
    <span id="jp-grand" style="display:none">10000</span>
  </div>

  <!-- Rules Panel -->
  <div class="rules-overlay" id="rules-overlay" style="display:none">
    <div class="rules-panel">
      <button class="rules-close" id="rules-close">✕</button>
      <div class="rules-tabs">
        <button class="rules-tab active" data-page="0">玩法</button>
        <button class="rules-tab" data-page="1">計分</button>
        <button class="rules-tab" data-page="2">Free Game</button>
      </div>
      <div class="rules-content" id="rules-content"></div>
    </div>
  </div>

  <!-- Auto Panel -->
  <div class="auto-overlay" id="auto-overlay" style="display:none">
    <div class="auto-panel">
      <div class="auto-stepper">
        <button class="ctrl-adj" id="auto-dec">−</button>
        <span id="auto-count-display">50 局</span>
        <button class="ctrl-adj" id="auto-inc">+</button>
      </div>
      <div class="auto-actions">
        <button class="auto-start" id="auto-start">開始</button>
        <button class="auto-cancel" id="auto-cancel">取消</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { spin, countScatters } from './js/slotEngine.js';
    import { GameManager } from './js/gameManager.js';
    import { playSfx } from './js/effects/sfxBus.js';
    import { playWinLines } from './js/effects/winLine.js';

    let muted = false;
    let turbo = false;
    function sfx(name) { if (!muted) playSfx(name); }

    const gm = new GameManager();
    const $ = id => document.getElementById(id);
    let spinning = false;

    // Build scatter ring segments (10 arcs with gaps)
    (function initRing() {
      const g = $('ring-segments');
      const R = 47, SEG = 10, GAP = 4;
      const arcLen = (360 - GAP * SEG) / SEG;
      for (let i = 0; i < SEG; i++) {
        const startAngle = i * (arcLen + GAP);
        const endAngle = startAngle + arcLen;
        const s = startAngle * Math.PI / 180, e = endAngle * Math.PI / 180;
        const x1 = 50 + R * Math.cos(s), y1 = 50 + R * Math.sin(s);
        const x2 = 50 + R * Math.cos(e), y2 = 50 + R * Math.sin(e);
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${x1} ${y1} A ${R} ${R} 0 0 1 ${x2} ${y2}`);
        path.setAttribute('class', 'ring-segment');
        path.dataset.idx = i;
        g.appendChild(path);
      }
    })();

    function updateRing(count) {
      const segs = document.querySelectorAll('.ring-segment');
      const glowG = $('ring-glow');
      glowG.innerHTML = '';
      segs.forEach((s, i) => {
        const active = i < count;
        s.classList.toggle('active', active);
        s.removeAttribute('filter');
        if (active) {
          const clone = s.cloneNode(true);
          clone.setAttribute('stroke', '#ffd700');
          clone.setAttribute('stroke-width', '9');
          glowG.appendChild(clone);
        }
      });
      $('ring-label').textContent = `${count}/10`;
      // Position orb at end of progress
      const orb = $('ring-orb');
      if (count === 0) { orb.style.display = 'none'; return; }
      orb.style.display = 'block';
      const SEG = 10, GAP = 4, arcLen = (360 - GAP * SEG) / SEG;
      const angle = (count * (arcLen + GAP) - GAP / 2) - 90;
      const rad = angle * Math.PI / 180;
      const R = 47;
      orb.style.left = `${50 + R * Math.cos(rad) - 6}%`;
      orb.style.top = `${50 + R * Math.sin(rad) - 6}%`;
    }
    let autoSpins = 0, autoStopped = false, autoCount = 50;

    const CARD_IMG = {
      1:'CD-01_ace.png',2:'CD-05_num2.png',3:'CD-06_num3.png',
      4:'CD-07_num4.png',5:'CD-08_num5.png',6:'CD-09_num6.png',
      7:'CD-10_num7.png',8:'CD-11_num8.png',9:'CD-12_num9.png',
      10:'CD-13_num10.png',11:'CD-04_jack.png',12:'CD-03_queen.png',13:'CD-02_king.png'
    };
    const SC_IMG = 'SC-01_scatter_dragon.png';
    const ALL_IMGS = Object.values(CARD_IMG);
    const REEL_SYMBOLS = 30;

    function cellImg(cell) { return cell.isScatter ? SC_IMG : CARD_IMG[cell.value]; }
    function randomImg() { return ALL_IMGS[Math.floor(Math.random() * 13)]; }
    function fmt(n) { return Math.round(n).toLocaleString(); }

    // Get cell height from reel
    function getCellH() {
      const reel = document.querySelector('.reel');
      return reel.getBoundingClientRect().height / 3;
    }

    function buildStrip(col, finalCells) { buildStripN(col, finalCells, REEL_SYMBOLS); }

    function animateSpin(board, fgBonusSymbols) {
      return new Promise(resolve => {
        spinning = true;
        if (turbo) {
          const cellH = getCellH();
          for (let col = 0; col < 3; col++) {
            const strip = document.querySelector(`#reel-${col} .reel-strip`);
            strip.innerHTML = '';
            strip.style.transition = 'none';
            strip.style.transform = 'translateY(0px)';
            for (let r = 0; r < 3; r++) {
              const div = document.createElement('div');
              div.className = 'cell';
              div.style.height = cellH + 'px';
              div.id = `cell-${r}-${col}`;
              div.innerHTML = `<img src="assets/img/${cellImg(board[r][col])}">`;
              strip.appendChild(div);
            }
          }
          if (fgBonusSymbols) buildFgReelStrip(fgBonusSymbols);
          spinning = false;
          resolve();
          return;
        }
        const cellH = getCellH();
        const overshoot = Math.round(cellH * 0.05);
        const MID_SYMBOLS = 50;

        for (let col = 0; col < 3; col++) {
          const numSym = col === 1 ? MID_SYMBOLS : REEL_SYMBOLS;
          const finalCells = [board[0][col], board[1][col], board[2][col]];
          buildStripN(col, finalCells, numSym);
        }

        const sideScrollDist = REEL_SYMBOLS * cellH;
        const sideFastDur = 700;
        const highSpeed = sideScrollDist / sideFastDur;

        const configs = [
          { scrollDist: REEL_SYMBOLS * cellH, decelDist: 9 * cellH, decelMs: 1350, ease: 'cubic-bezier(0.22, 1, 0.36, 1)' },
          { scrollDist: MID_SYMBOLS * cellH, decelDist: 18 * cellH, decelMs: 2400, ease: 'cubic-bezier(0.16, 1, 0.3, 1)' },
          { scrollDist: REEL_SYMBOLS * cellH, decelDist: 9 * cellH, decelMs: 1350, ease: 'cubic-bezier(0.22, 1, 0.36, 1)' },
        ];

        const totalAxes = fgBonusSymbols ? 4 : 3;
        let done = 0;

        for (let col = 0; col < 3; col++) {
          const strip = document.querySelector(`#reel-${col} .reel-strip`);
          const cfg = configs[col];
          const targetY = cfg.scrollDist;
          const fastDist = targetY - cfg.decelDist;
          const fastDur = Math.round(fastDist / highSpeed);

          strip.style.transition = `transform ${fastDur}ms linear`;
          strip.style.transform = `translateY(-${fastDist}px)`;

          setTimeout(() => {
            const overshootY = targetY + overshoot;
            strip.style.transition = `transform ${cfg.decelMs}ms ${cfg.ease}`;
            strip.style.transform = `translateY(-${overshootY}px)`;

            setTimeout(() => {
              strip.style.transition = 'transform 90ms cubic-bezier(0.33, 1, 0.68, 1)';
              strip.style.transform = `translateY(-${targetY}px)`;

              setTimeout(() => {
                const root = document.querySelector('.game-root');
                root.style.transform = 'translateY(1px)';
                setTimeout(() => { root.style.transform = ''; }, 50);
                done++;
                if (done === totalAxes) { spinning = false; resolve(); }
              }, 100);
            }, cfg.decelMs);
          }, fastDur);
        }

        // FG bonus reel: starts simultaneously, stops last (500ms after middle)
        if (fgBonusSymbols) {
          const fgCellH = Math.round(fgReelEl.clientHeight / 3);
          const numSym = 40;
          buildFgReelStripAnim(fgBonusSymbols, numSym, fgCellH);
          const fgTotalDist = numSym * fgCellH;
          const fgFastDist = Math.round(fgTotalDist * 0.35);
          const fgFastDur = Math.round(fgFastDist / highSpeed);
          const fgDecelMs = 2900; // middle=2400 + 500

          fgStripEl.style.transition = `transform ${fgFastDur}ms linear`;
          fgStripEl.style.transform = `translateY(-${fgFastDist}px)`;

          setTimeout(() => {
            fgStripEl.style.transition = `transform ${fgDecelMs}ms cubic-bezier(0.16, 1, 0.3, 1)`;
            fgStripEl.style.transform = `translateY(-${fgTotalDist}px)`;
            setTimeout(() => {
              done++;
              if (done === totalAxes) { spinning = false; resolve(); }
            }, fgDecelMs);
          }, fgFastDur);
        }
      });
    }

    function buildFgReelStripAnim(bonusSymbols, numSym, cellH) {
      fgStripEl.innerHTML = '';
      fgStripEl.style.transition = 'none';
      fgStripEl.style.transform = 'translateY(0px)';
      for (let i = 0; i < numSym; i++) {
        const div = document.createElement('div');
        div.className = 'fg-reel-cell';
        div.style.height = cellH + 'px';
        div.textContent = FG_SYMS[Math.floor(Math.random() * FG_SYMS.length)];
        fgStripEl.appendChild(div);
      }
      for (let r = 0; r < 3; r++) {
        const div = document.createElement('div');
        div.className = 'fg-reel-cell';
        div.style.height = cellH + 'px';
        div.textContent = bonusSymbols[r];
        fgStripEl.appendChild(div);
      }
    }

    function buildFgReelStrip(bonusSymbols) {
      const cellH = Math.round(fgReelEl.clientHeight / 3);
      fgStripEl.innerHTML = '';
      fgStripEl.style.transition = 'none';
      fgStripEl.style.transform = 'translateY(0px)';
      for (let r = 0; r < 3; r++) {
        const div = document.createElement('div');
        div.className = 'fg-reel-cell';
        div.style.height = cellH + 'px';
        div.textContent = bonusSymbols[r];
        fgStripEl.appendChild(div);
      }
    }

    function buildStripN(col, finalCells, numSym) {
      const strip = document.querySelector(`#reel-${col} .reel-strip`);
      const cellH = getCellH();
      strip.innerHTML = '';
      strip.style.transition = 'none';
      strip.style.transform = 'translateY(0px)';
      for (let i = 0; i < numSym; i++) {
        const div = document.createElement('div');
        div.className = 'cell';
        div.style.height = cellH + 'px';
        div.innerHTML = `<img src="assets/img/${randomImg()}">`;
        strip.appendChild(div);
      }
      for (let r = 0; r < 3; r++) {
        const div = document.createElement('div');
        div.className = 'cell';
        div.style.height = cellH + 'px';
        div.id = `cell-${r}-${col}`;
        div.innerHTML = `<img src="assets/img/${cellImg(finalCells[r])}">`;
        strip.appendChild(div);
      }
    }

    const FG_SYMS = ['+15','+30','+60','+90','+120','+200','+500','—'];
    const fgReelEl = $('fg-reel'), fgStripEl = $('fg-reel-strip');

    function showFgReel() {
      for (let r = 0; r < 3; r++) $(`badge-${r}`).style.display = 'none';
      fgReelEl.style.display = 'block';
    }
    function hideFgReel() {
      fgReelEl.style.display = 'none';
      for (let r = 0; r < 3; r++) $(`badge-${r}`).style.display = '';
    }
    function showFGResult(total) {
      const overlay = $('fg-result-overlay');
      const amountEl = $('fg-result-amount');
      const bigEl = $('fg-result-big');
      overlay.style.display = 'flex';
      bigEl.style.display = total > gm.bet * 20 ? 'block' : 'none';
      amountEl.textContent = '0';
      const duration = 2000;
      const start = performance.now();
      function tick(now) {
        const p = Math.min((now - start) / duration, 1);
        amountEl.textContent = fmt(Math.round(total * p));
        if (p < 1) requestAnimationFrame(tick);
        else sfx('coin_count');
      }
      requestAnimationFrame(tick);
      const close = () => { overlay.style.display = 'none'; };
      overlay.onclick = close;
      setTimeout(close, 3500);
    }

    function updateUI() {
      $('balance').textContent = fmt(gm.balance);
      $('bet').textContent = fmt(gm.bet);
      $('spin-btn').disabled = spinning || !gm.canSpin();
      $('bet-dec').disabled = spinning || gm.betIndex <= 0;
      $('bet-inc').disabled = spinning || gm.betIndex >= 4;
      $('auto-btn').textContent = autoSpins > 0 ? `${autoSpins}` : '自動';
      const fgEl = $('fg-info');
      if (gm.fg.active) { fgEl.style.display = 'block'; fgEl.textContent = `FG: ${gm.fg.spinsLeft}轉 | ${fmt(gm.fg.totalScore)}分`; }
      else { fgEl.style.display = 'none'; }
      // Update JP pool display
      $('jp-grand-val').textContent = fmt(Math.round(gm.jp.pools.grand));
      $('jp-major-val').textContent = fmt(Math.round(gm.jp.pools.major));
      $('jp-mini-val').textContent = fmt(Math.round(gm.jp.pools.basic));
    }

    async function doSpin() {
      if (spinning || !gm.canSpin()) return;
      for (let r = 0; r < 3; r++) { $(`badge-${r}`).textContent = ''; $(`badge-${r}`).className = 'badge badge-' + r; }
      const isFG = gm.fg.active;
      if (isFG) showFgReel(); else hideFgReel();
      sfx('spin_charge');
      updateUI();
      const result = gm.executeSpin();
      if (!result) return;
      if (result.mode === 'fg') {
        await animateSpin(result.board, result.bonusSymbols);
        sfx('spin_release');
        // Win lines for rows that scored
        const winRows = result.judgments
          .filter(j => j.type === 'through' && result.bonusSymbols[j.row] !== '—')
          .map(j => ({ row: j.row, badgeEl: $(`badge-${j.row}`) }));
        if (winRows.length > 0) await playWinLines(winRows);
        // Now update FG info
        $('results').textContent = `FG ${result.bonusSymbols.join(' ')} | +${fmt(result.spinScore)} | 累積 ${fmt(result.totalScore)}`;
        updateUI();
        if (result.fgDone) { hideFgReel(); showFGResult(result.totalScore); }
        else { setTimeout(() => doSpin(), 400); }
        return result;
      }
      await animateSpin(result.board);
      sfx('spin_release');
      showResult(result);
      // Play result sfx + win line effect
      if (result.mode === 'normal') {
        for (const j of result.judgments) {
          if (j.type === 'wall' || j.type === 'same-hit') sfx('wall_hit');
          else if (j.type === 'through') sfx('gate_through');
        }
        if (result.scatterCount > 0) sfx('dragon_growl');
        if (result.totalPayout > 0) sfx('coin_count');
        if (result.fgTriggered) sfx('gate_open');
        const winRows = result.judgments
          .filter(j => j.type === 'through')
          .map(j => ({ row: j.row, badgeEl: $(`badge-${j.row}`) }));
        if (winRows.length > 0) await playWinLines(winRows);
      }
      updateUI();
      if (result.fgTriggered || (result.mode === 'fg' && gm.fg.active)) {
        setTimeout(() => doSpin(), 400);
      }
      return result;
    }

    function showResult(result) {
      for (let r = 0; r < 3; r++) { $(`badge-${r}`).textContent = ''; $(`badge-${r}`).className = 'badge badge-' + r; }
      if (result.mode === 'fg') { return; }
      result.judgments.forEach(j => {
        const badge = $(`badge-${j.row}`);
        const rowScatters = [result.board[j.row][0], result.board[j.row][1], result.board[j.row][2]].filter(c => c.isScatter).length;
        if (rowScatters > 0) { badge.textContent = `🐉 +${rowScatters}`; badge.classList.add('sc'); }
        else if (j.type === 'through') { badge.textContent = '穿門\n+' + fmt(Math.round(gm.bet/3*j.mult)); badge.classList.add('win'); }
        else if (j.type === 'wall') { badge.textContent = '🔥 -1'; badge.classList.add('wall'); }
        else if (j.type === 'same-hit') { badge.textContent = '🔥 -2'; badge.classList.add('wall'); }
        else { badge.textContent = '—'; }
      });
      const winEl = $('win');
      if (result.totalPayout > 0) { winEl.textContent = fmt(result.totalPayout); winEl.style.color = '#ffd700'; }
      else { winEl.textContent = '0'; winEl.style.color = '#ffd700'; }
      $('results').textContent = result.fgTriggered ? '🎰 Free Game!' : '';
      updateRing(gm.scatterLamps);
    }

    // Auto
    function toggleAuto() {
      if (autoSpins > 0) { autoStopped = true; autoSpins = 0; updateUI(); return; }
      $('auto-overlay').style.display = 'flex';
    }
    async function startAuto() {
      $('auto-overlay').style.display = 'none';
      autoSpins = autoCount; autoStopped = false;
      while (autoSpins > 0 && !autoStopped && gm.canSpin()) {
        await doSpin(); autoSpins--; updateUI();
        if (autoSpins > 0 && !autoStopped) await new Promise(r => setTimeout(r, 300));
      }
      autoSpins = 0; updateUI();
    }

    // Init: show random symbols
    function initReels() {
      const cellH = getCellH();
      for (let col = 0; col < 3; col++) {
        const strip = document.querySelector(`#reel-${col} .reel-strip`);
        strip.innerHTML = '';
        for (let r = 0; r < 3; r++) {
          const div = document.createElement('div');
          div.className = 'cell';
          div.style.height = cellH + 'px';
          div.id = `cell-${r}-${col}`;
          div.innerHTML = `<img src="assets/img/${randomImg()}">`;
          strip.appendChild(div);
        }
      }
    }

    initReels();
    updateUI();
    $('results').textContent = '';
    updateRing(gm.scatterLamps);
    $('spin-btn').addEventListener('click', doSpin);
    $('bet-dec').addEventListener('click', () => { if (!spinning) { gm.setBetIndex(gm.betIndex-1); updateUI(); } });
    $('bet-inc').addEventListener('click', () => { if (!spinning) { gm.setBetIndex(gm.betIndex+1); updateUI(); } });
    $('auto-btn').addEventListener('click', toggleAuto);
    $('auto-start').addEventListener('click', startAuto);
    $('auto-cancel').addEventListener('click', () => { $('auto-overlay').style.display = 'none'; });
    $('auto-dec').addEventListener('click', () => { autoCount = Math.max(10, autoCount-10); $('auto-count-display').textContent = autoCount+' 局'; });
    $('auto-inc').addEventListener('click', () => { autoCount = Math.min(100, autoCount+10); $('auto-count-display').textContent = autoCount+' 局'; });
    // Rules overlay
    const RULES_PAGES = [
      `<h3>🎰 遊戲玩法</h3><p>射龍門 Slot，3×3 盤面。</p><p>左右欄決定「門寬」，中欄判定穿門。</p><ul><li>穿門成功 → 依門寬賠率派彩</li><li>碰壁 → 不扣錢，扣 1 個 Scatter 燈</li><li>同值撞柱 → 不扣錢，扣 2 個 Scatter 燈</li></ul>`,
      `<h3>💰 計分規則</h3><p>穿門賠率（依門寬）：</p><ul><li>極窄（差2）：×15</li><li>窄（差3~4）：×6</li><li>中（差5~8）：×3</li><li>寬（差9~11）：×1</li></ul><p>每次 Spin 扣 bet（bet 平均分配給三列）</p><p>🐉 Scatter 龍符號：累積燈號 +1</p>`,
      `<h3>🐲 Free Game</h3><ul><li>Scatter 累積燈號達 10 個觸發</li><li>碰壁扣 1 燈、同值扣 2 燈（會延遲觸發）</li><li>Free Game 中不出 Scatter、不碰壁</li><li>穿門成功直接獲得彩金</li><li>觸發後燈號歸零重新收集</li></ul>`
    ];
    function showRulesPage(page) {
      $('rules-content').innerHTML = RULES_PAGES[page];
      document.querySelectorAll('.rules-tab').forEach(t => t.classList.toggle('active', +t.dataset.page === page));
    }
    $('rules-btn').addEventListener('click', () => { $('rules-overlay').style.display = 'flex'; showRulesPage(0); });
    $('rules-close').addEventListener('click', () => { $('rules-overlay').style.display = 'none'; });
    $('rules-overlay').addEventListener('click', e => { if (e.target === $('rules-overlay')) $('rules-overlay').style.display = 'none'; });
    document.querySelectorAll('.rules-tab').forEach(t => t.addEventListener('click', () => showRulesPage(+t.dataset.page)));
    $('vol-btn').addEventListener('click', () => {
      muted = !muted;
      $('vol-btn').classList.toggle('muted', muted);
      $('vol-btn').innerHTML = muted
        ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>'
        : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.08"/></svg>';
    });
    $('turbo-btn').addEventListener('click', () => {
      turbo = !turbo;
      $('turbo-btn').classList.toggle('active', turbo);
      $('turbo-btn').style.background = turbo ? 'rgba(255,215,0,0.25)' : '';
    });
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && !e.repeat) { e.preventDefault(); doSpin(); }
      if (e.key === 'f' && !gm.fg.active && !spinning) { gm.triggerFreeGame(); updateUI(); setTimeout(doSpin, 300); }
    });
  </script>
</body>
</html>
