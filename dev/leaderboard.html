<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>射龍門 排行榜</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, sans-serif; padding: 16px; max-width: 500px; margin: 0 auto; }
h1 { color: #ffd700; text-align: center; font-size: 1.6rem; margin: 20px 0; text-shadow: 0 2px 8px rgba(255,215,0,0.4); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 12px; text-align: center; border-bottom: 1px solid #333; }
th { color: #ffd700; font-size: 0.85rem; }
td { font-size: 1rem; }
.rank-1 { color: #ffd700; font-weight: bold; }
.rank-2 { color: #c0c0c0; font-weight: bold; }
.rank-3 { color: #cd7f32; font-weight: bold; }
.score { color: #ffd700; font-weight: bold; }
.empty { text-align: center; color: #666; margin-top: 40px; }
</style>
</head>
<body>
<h1>🏆 射龍門 排行榜</h1>
<table>
  <thead><tr><th>排名</th><th>姓名</th><th>分數</th></tr></thead>
  <tbody id="lb-body"><tr><td colspan="3" class="empty">載入中...</td></tr></tbody>
</table>
<h2 style="color:#ffd700;font-size:1.2rem;margin-top:24px;text-align:center;">👥 組別排行</h2>
<table>
  <thead><tr><th>排名</th><th>組別</th><th>總分</th></tr></thead>
  <tbody id="team-lb-body"><tr><td colspan="3" class="empty">載入中...</td></tr></tbody>
</table>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxRJAhGu732WkIRj17yUhZ4bGTqdVY-wHjv2gIhVAWNs5z7n8J3tY5Uo5UogmYrH4y2/exec';
const medals = ['','🥇','🥈','🥉'];
function fmt(n) { return Math.round(n).toLocaleString(); }
async function refresh() {
  try {
    const resp = await fetch(API);
    const data = await resp.json();
    const tbody = document.getElementById('lb-body');
    const teamBody = document.getElementById('team-lb-body');
    if (!data.scores || data.scores.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" class="empty">尚無紀錄</td></tr>';
      teamBody.innerHTML = '<tr><td colspan="3" class="empty">尚無紀錄</td></tr>';
      return;
    }
    tbody.innerHTML = data.scores.map((s, i) => {
      const rc = i < 3 ? ` class="rank-${i+1}"` : '';
      const medal = medals[i+1] || '';
      const tm = s.team ? `[${s.team}] ` : '';
      return `<tr${rc}><td>${medal} ${i+1}</td><td>${tm}${s.name.replace(/\u200B/g,'')}</td><td class="score">${fmt(s.score)}</td></tr>`;
    }).join('');
    // Team rankings (average)
    const teams = {};
    const teamCount = {};
    data.scores.forEach(s => { const t = s.team || '?'; teams[t] = (teams[t] || 0) + s.score; teamCount[t] = (teamCount[t] || 0) + 1; });
    const sorted = Object.entries(teams).map(([t, total]) => [t, total, teamCount[t], Math.round(total / teamCount[t])]).sort((a,b) => b[3] - a[3]);
    teamBody.innerHTML = sorted.map(([t, total, cnt, avg], i) => {
      const rc = i < 3 ? ` class="rank-${i+1}"` : '';
      const medal = medals[i+1] || '';
      return `<tr${rc}><td>${medal} ${i+1}</td><td>${t}（${cnt}人）</td><td class="score">平均 ${fmt(avg)}</td></tr>`;
    }).join('');
  } catch(e) { console.error(e); }
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
