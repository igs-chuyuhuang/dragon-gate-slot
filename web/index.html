<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>射龍門 Slot</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>🐉 射龍門 Slot</h1>

  <div class="jp-bar">
    <span class="jp basic">🔵 Basic: <strong id="jp-basic">500</strong></span>
    <span class="jp major">🟠 Major: <strong id="jp-major">2000</strong></span>
    <span class="jp grand">🔴 Grand: <strong id="jp-grand">10000</strong></span>
  </div>

  <div id="fg-info" class="fg-info" style="display:none"></div>

  <div class="board">
    <div class="cell" id="cell-0-0">-</div>
    <div class="cell" id="cell-0-1">-</div>
    <div class="cell" id="cell-0-2">-</div>
    <div class="cell" id="cell-1-0">-</div>
    <div class="cell" id="cell-1-1">-</div>
    <div class="cell" id="cell-1-2">-</div>
    <div class="cell" id="cell-2-0">-</div>
    <div class="cell" id="cell-2-1">-</div>
    <div class="cell" id="cell-2-2">-</div>
  </div>

  <div class="controls">
    <button class="small" id="bet-down">◀</button>
    <span>押注: <strong id="bet">10</strong></span>
    <button class="small" id="bet-up">▶</button>
    <button id="spin-btn">SPIN</button>
  </div>

  <div class="info">
    <span>餘額: <strong id="balance">1000</strong></span>
    <span>贏分: <strong id="win">0</strong></span>
  </div>

  <pre id="results">按 SPIN 開始遊戲</pre>
  <p style="font-size:12px;color:#666;margin-top:8px">按 F 進入 Free Game（測試用）</p>

  <script type="module">
    import { init } from './js/uiController.js';
    init();
  </script>
</body>
</html>
