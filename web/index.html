<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>射龍門 Slot</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/effects.css">
</head>
<body>
  <!-- Logo Title -->
  <h1 class="logo">射龍門<span class="logo-sub">DRAGON GATE SLOT</span></h1>

  <!-- JP Panel -->
  <div class="jp-bar">
    <div class="jp basic"><img src="assets/img/JP-01_basic.png" alt="Basic"><span id="jp-basic">500</span></div>
    <div class="jp major"><img src="assets/img/JP-02_major.png" alt="Major"><span id="jp-major">2,000</span></div>
    <div class="jp grand"><img src="assets/img/JP-03_grand.png" alt="Grand"><span id="jp-grand">10,000</span></div>
  </div>

  <!-- Free Game Info -->
  <div id="fg-info" class="fg-info" style="display:none"></div>

  <!-- Main Stage -->
  <div class="stage">
    <div class="stage-frame">
      <div class="board">
        <div class="cell" id="cell-0-0"></div>
        <div class="cell" id="cell-0-1"></div>
        <div class="cell" id="cell-0-2"></div>
        <div class="cell" id="cell-1-0"></div>
        <div class="cell" id="cell-1-1"></div>
        <div class="cell" id="cell-1-2"></div>
        <div class="cell" id="cell-2-0"></div>
        <div class="cell" id="cell-2-1"></div>
        <div class="cell" id="cell-2-2"></div>
      </div>
    </div>
  </div>

  <!-- Win Popup Overlay -->
  <div id="win-popup" class="win-popup" style="display:none">
    <img src="assets/img/UI-05_win_frame.png" class="win-frame" alt="Win">
    <div class="win-popup-content">
      <div class="win-popup-label">恭喜獲得</div>
      <div class="win-popup-amount" id="win-popup-amount">0</div>
    </div>
  </div>

  <!-- Bottom Console -->
  <div class="console">
    <div class="console-section">
      <div class="console-panel" style="background-image:url('assets/img/UI-03_balance.png')">
        <span class="panel-label">餘額</span>
        <strong id="balance">1,000</strong>
      </div>
    </div>
    <div class="console-section console-center">
      <button class="small" id="bet-down">◀</button>
      <div class="console-panel" style="background-image:url('assets/img/UI-02_bet_panel.png')">
        <span class="panel-label">押注</span>
        <strong id="bet">10</strong>
      </div>
      <button class="small" id="bet-up">▶</button>
    </div>
    <div class="console-section">
      <div class="console-panel win-panel">
        <span class="panel-label">贏分</span>
        <strong id="win">0</strong>
      </div>
    </div>
  </div>

  <!-- SPIN Button -->
  <button id="spin-btn" class="spin-btn">
    <img src="assets/img/UI-04_spin_btn.png" alt="SPIN">
    <span class="spin-label">SPIN</span>
  </button>

  <!-- Auto Controls -->
  <div class="auto-group">
    <button class="auto-preset" data-count="10">10次</button>
    <button class="auto-preset" data-count="50">50次</button>
    <button class="auto-preset" data-count="100">100次</button>
    <button id="auto-btn">自動</button>
  </div>

  <!-- Results Panel -->
  <div id="results">按 SPIN 開始遊戲</div>

  <script type="module">
    import { init } from './js/uiController.js';
    init();
  </script>
</body>
</html>
