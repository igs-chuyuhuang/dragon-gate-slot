<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>射龍門 Slot</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/effects.css">
</head>
<body>
  <!-- JP Panel -->
  <div class="jp-bar">
    <div class="jp basic"><img src="assets/img/JP-01_basic.png" alt="Basic"><span id="jp-basic">500</span></div>
    <div class="jp major"><img src="assets/img/JP-02_major.png" alt="Major"><span id="jp-major">2,000</span></div>
    <div class="jp grand"><img src="assets/img/JP-03_grand.png" alt="Grand"><span id="jp-grand">10,000</span></div>
  </div>

  <!-- Free Game Info -->
  <div id="fg-info" class="fg-info" style="display:none"></div>

  <!-- Main Stage -->
  <div class="stage">
    <div class="board">
      <div class="cell" id="cell-0-0"></div>
      <div class="cell" id="cell-0-1"></div>
      <div class="cell" id="cell-0-2"></div>
      <div class="cell" id="cell-1-0"></div>
      <div class="cell" id="cell-1-1"></div>
      <div class="cell" id="cell-1-2"></div>
      <div class="cell" id="cell-2-0"></div>
      <div class="cell" id="cell-2-1"></div>
      <div class="cell" id="cell-2-2"></div>
    </div>
  </div>

  <!-- Results Panel -->
  <div id="results">按 SPIN 開始遊戲</div>

  <!-- Bottom Console -->
  <div class="console">
    <div class="info">
      <span class="info-box">餘額 <strong id="balance">1,000</strong></span>
      <span class="info-box win-box">贏分 <strong id="win">0</strong></span>
    </div>
    <div class="controls">
      <button class="small" id="bet-down">◀</button>
      <span class="bet-display">押注 <strong id="bet">10</strong></span>
      <button class="small" id="bet-up">▶</button>
    </div>
    <div class="auto-group">
      <button class="auto-preset" data-count="10">10次</button>
      <button class="auto-preset" data-count="50">50次</button>
      <button class="auto-preset" data-count="100">100次</button>
      <button id="auto-btn">自動</button>
    </div>
  </div>

  <!-- SPIN Button -->
  <button id="spin-btn" class="spin-btn">
    <img src="assets/img/UI-04_spin_btn.png" alt="SPIN">
    <span class="spin-label">SPIN</span>
  </button>

  <script type="module">
    import { init } from './js/uiController.js';
    init();
  </script>
</body>
</html>
